qa: [
["Why is the Iron Age considered the last principal period in the three-age system?","Because the three-age system classifies pre-historic societies into Stone, Bronze, and Iron Ages in chronological order, and the Iron Age — where iron tools and weapons became prominent — comes after the Bronze Age, making it the final and last principal period of this classification."],
["How was iron possibly created as a by-product during the Bronze Age?","Some sources suggest that iron was being created in some places as a by-product of copper refining, and it was not reproducible by the metallurgy techniques of that time, which is why it remained rare and expensive, sometimes even more costly than gold."],
["Why did bronze production decline around 1800 B.C., and what effect did this have?","Around 1800 B.C., for reasons yet unknown to archaeologists, tin became scarce, causing a decline in bronze production. This led to trade disruption in many places, which forced people to seek an alternative to bronze, making the use of iron more prominent during the ancient period."],
["Why was iron eventually preferred over bronze, even though steel weapons were hard to produce?","Steel weapons and tools were nearly the same weight as bronze but stronger; however, steel was difficult to produce with the methods available. Therefore, many Iron Age tools were instead made of wrought iron — though weaker than bronze, it was less expensive, more easily sharpened by grinding rather than reforging, and iron itself was more abundant than the copper and tin needed for bronze."],
["Explain how the rotary quern worked to grind grain.","The rotary quern was made from two flat stones, one on top of the other. Grain was poured into a hole in the upper stone, which was then turned by a handle. Because the lower stone stayed still, the grain was crushed between the two stones, making grinding flour much quicker and easier than before."],
["Describe the process a blacksmith used to make a sword.","Iron Age blacksmiths made strong swords by heating a bar of iron over a charcoal fire. When the iron became white hot, the smith rested the bar on an anvil and hammered it into shape before it cooled. Blacksmiths worked with tongs and hammers, and used metal files to smooth off any rough edges from the finished sword."],
["How did the potter's wheel improve pottery-making in the Iron Age?","People started using potter's wheels at the end of the Iron Age. Potters used their feet to turn the wheel, and as it turned, they used both hands to shape the clay. The use of the wheel meant people could make pots in many more shapes and sizes than before."],
["What was the purpose of the iron-tipped plough, and how did it help farmers?","The iron-tipped plough (also called an 'ard') was made mostly of wood but had an iron tip to help it cut through heavy soil. It was guided by the farmer and pulled by oxen, meaning farmers no longer needed to use antlers and stone tools to dig up their land."],
["Describe how a loom was used by Iron Age weavers.","Weavers hung long threads from a tall loom made from wood. These vertical threads were weighted down with stones to keep them taut, and the weaver used a wooden tool called a shuttle to pass different threads between the vertical threads to create the fabric."],
["Why was the use of chariots eventually modified/replaced by other methods in battle?","In battle, a heavily armored warrior could not be expected to move very quickly or mount and ride on horseback, so it was only during the later classical era that chariots were modified for racing; the development of the two-horse chariot had solved the earlier problem of quick mounting."],
["Describe the armour and shields used by Iron Age warriors.","Warriors wore armour made from bronze, iron, or a combination of both. Fashioned like a tunic, the armour might hang as low as the knees and extend all the way to the wrists. The shields used alongside this armour were cumbersome."],
["What was the difference between how javelins and spears were used in battle?","Javelins were thrown at the enemy from long range, while spears were wielded by hand. Both were lighter projectile weapons that usually featured a metal tip attached to a wooden shaft, carried by foot soldiers into battle alongside a shield, and kept in a quiver when transported in a chariot."],
["How did swords change in shape from the late Bronze Age through the Iron Age?","Swords of the late Bronze Age tended to be sickle-shaped, but as iron was introduced, the curve of the blade became less pronounced. These swords were more like large daggers and were usually hung in sheaths across the chest or back; short swords and daggers were the weapons of choice in the early Iron Age."],
["Describe the typical clothing worn by Iron Age people.","Iron Age clothes were made from wool and dyed with natural vegetable dyes (from plants and berries) in blue, yellow or red. Trousers were worn under a tunic, held at the waist with a belt, and over this people wore a cloak with a striped or checked pattern, fastened by a brooch."],
["What kind of jewellery did Iron Age people wear, and who wore a torc?","People in the Iron Age wore metal jewellery with symmetrical designs. Brooches and pins were used to fasten their clothes, and a torc — a gold neck ring — was worn by important people like chieftains and warriors."],
["Describe the religious beliefs and practices of Iron Age people.","People during the Iron Age believed in powerful spirits and met to worship them in sacred places, like the shores of a lake or a clearing in the woods. Priests led religious ceremonies, sacrificed animals and sometimes humans too, and gave precious offerings such as swords and cups to the spirits, burying them in the ground or throwing them into rivers and lakes."],
["How did the discovery of iron impact everyday life and settlement size?","People in the Iron Age learned how to use iron, and this discovery had a dramatic impact on everyday life. Iron tools made farming much easier than before, and as a result, settlements grew in size."],
["Why did many Iron Age people live in hill forts? Describe their structure.","The Iron Age was a violent period, with rival tribes fighting using deadly iron weapons, so many people lived in hill forts to keep themselves safe from attacks. The forts were surrounded by walls and ditches, and warriors defended their people from enemy attacks."],
["Describe the design and daily life of round houses inside hill forts.","Inside the hill forts, families lived in round houses. These were simple one-room homes with a painted, thatched roof and walls made from a mixture of mud and other things."],
["What kind of livestock and crops did Iron Age farmers keep and grow?","Iron Age farmers grew crops and vegetables. They kept geese, goats and pigs, and had large herds of cows and flocks of sheep. Some people worked as potters, carpenters and metal workers, while men and boys were trained as warriors, prepared to fight at any time."],
["How were dugouts constructed, and what were they mainly used for?","Dugouts were made from either lime trees or oak trees, with the logs hollowed out. Builders would spread out the wood so that the dugouts could accommodate more people for travel. While dugouts were primarily used to travel small distances on rivers, they were also sometimes used for longer sea travel."],
["Describe the Hjort Spring boat and its significance in sea travel.","A famous example of a bigger boat used during the early Iron Age is the Hjort Spring boat. This was a plank boat made of wood, specifically lime or oak, that was pushed forward by paddles. Its light weight made it easy to manoeuvre during sea travel."],
["Describe the different types of land transport used in the Iron Age.","While walking was the most common form of land travel, carriage transport also became increasingly popular during this period. People of higher social status used more expensive carriages, and historical research indicates that only a few individuals travelled by horse; as more roads were created, wagon use became more popular, with oxen towing heavier wagons than those from the Bronze Age."],
["What do we know about coinage during the Iron Age?","Coinage was first minted in Britain around 100 B.C., and coins were made of gold, silver and bronze."],
["How was grain stored and preserved during the Iron Age, and how did surplus grain affect trade?","The grain was stored in granaries or in underground vaults, and meat or fish could be preserved by salting or smoking. As people began to produce and store more grains than they could use, they were able to trade the surplus."],

const VOICE_SECTIONS = ['fib','oneword','tf'];
const UNSCORED_SECTIONS = ['defs','qa','reasoning'];

const SECTIONS = [
  {id:'fib', label:'Fill Blanks', title:'Fill in the Blanks'},
  {id:'mcq', label:'MCQ', title:'Multiple Choice Questions'},
  {id:'oneword', label:'One Word', title:'One Word Answers'},
  {id:'defs', label:'Definitions', title:'Definitions'},
  {id:'qa', label:'Short Q&A', title:'Short Question & Answer'},
  {id:'tf', label:'True/False', title:'True or False'},
  {id:'reasoning', label:'Reasoning', title:'Reasoning'}
];

const STORAGE_KEY = 'quiz-progress-iron-age';
let progress = {}; // {sectionId: {qIndex: {correct, userVal, revealed, attempted}}}
let viewMode = {}; // {sectionId: 'list' | 'voice'}  -- only meaningful for VOICE_SECTIONS
let voiceState = null; // active voice round state, one at a time

function normalize(s){
  return (s||'').toString().toLowerCase().trim().replace(/[.,'"“”‘’]/g,'').replace(/\s+/g,' ');
}
function fuzzyMatch(userText, correctText){
  const u = normalize(userText), c = normalize(correctText);
  if(!u) return false;
  return u === c || u.includes(c) || c.includes(u);
}
function speechTextForFib(text){
  return text.replace(/_{3,}/g, 'blank');
}

/* ================== PERSISTENCE (localStorage) ================== */
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object') progress = parsed;
    }
  }catch(e){
    progress = {};
  }
}
function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  }catch(e){
    console.error('Could not save progress', e);
  }
}
function saveAnswer(sectionId, idx, correct, userVal, revealedOnly){
  if(!progress[sectionId]) progress[sectionId] = {};
  progress[sectionId][idx] = { correct: correct, userVal: userVal, revealed: !!revealedOnly, attempted: true };
  persist();
}

/* ================== BUILD UI SHELL ================== */
function buildTabs(){
  const tabs = document.getElementById('tabs');
  SECTIONS.forEach((s,i)=>{
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i===0?' active':'');
    btn.textContent = s.label;
    btn.onclick = ()=> showSection(s.id);
    btn.id = 'tabbtn-'+s.id;
    tabs.appendChild(btn);
  });
}
function showSection(id){
  document.querySelectorAll('.section').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
  document.getElementById('tabbtn-'+id).classList.add('active');
}

function buildSections(){
  const root = document.getElementById('sections');
  SECTIONS.forEach(sec=>{
    viewMode[sec.id] = 'list';

    const wrap = document.createElement('div');
    wrap.className = 'section';
    wrap.id = 'sec-'+sec.id;

    // panel head
    const head = document.createElement('div');
    head.className = 'panel-head';
    const h = document.createElement('h2');
    h.textContent = sec.title;
    head.appendChild(h);

    const meta = document.createElement('div');
    meta.className = 'panel-meta';
    const countSpan = document.createElement('span');
    countSpan.id = 'count-'+sec.id;
    countSpan.textContent = '0 / ' + DATA[sec.id].length + ' answered';
    const resetBtn = document.createElement('button');
    resetBtn.className = 'section-reset-btn';
    resetBtn.textContent = 'Reset Section';
    resetBtn.onclick = ()=> resetSection(sec.id);
    meta.appendChild(countSpan);
    meta.appendChild(resetBtn);
    head.appendChild(meta);

    wrap.appendChild(head);

    // voice/list toggle row (only for voice-capable sections), own full-width row
    if(VOICE_SECTIONS.includes(sec.id)){
      const toggleRow = document.createElement('div');
      toggleRow.className = 'mode-toggle-row';
      const listBtn = document.createElement('button');
      listBtn.textContent = 'List View';
      listBtn.className = 'active';
      listBtn.id = 'toggle-list-'+sec.id;
      const voiceBtn = document.createElement('button');
      voiceBtn.textContent = 'Voice Round';
      voiceBtn.id = 'toggle-voice-'+sec.id;
      listBtn.onclick = ()=> switchMode(sec.id, 'list');
      voiceBtn.onclick = ()=> switchMode(sec.id, 'voice');
      toggleRow.appendChild(listBtn);
      toggleRow.appendChild(voiceBtn);
      wrap.appendChild(toggleRow);

      const voiceContainer = document.createElement('div');
      voiceContainer.id = 'voicewrap-'+sec.id;
      voiceContainer.style.display = 'none';
      wrap.appendChild(voiceContainer);
    }

    const listContainer = document.createElement('div');
    listContainer.id = 'list-'+sec.id;
    wrap.appendChild(listContainer);

    root.appendChild(wrap);
    renderList(sec.id);
  });
}

function switchMode(sectionId, mode){
  viewMode[sectionId] = mode;
  document.getElementById('toggle-list-'+sectionId).classList.toggle('active', mode==='list');
  document.getElementById('toggle-voice-'+sectionId).classList.toggle('active', mode==='voice');
  document.getElementById('list-'+sectionId).style.display = (mode==='list') ? 'block' : 'none';
  const vw = document.getElementById('voicewrap-'+sectionId);
  vw.style.display = (mode==='voice') ? 'block' : 'none';
  if(mode==='voice'){
    endActiveVoiceRoundIfAny(false);
    renderVoiceStartScreen(sectionId);
  } else {
    endActiveVoiceRoundIfAny(true);
  }
}

/* ================== LIST VIEW RENDERING ================== */
function renderList(sectionId){
  const container = document.getElementById('list-'+sectionId);
  container.innerHTML = '';
  const items = DATA[sectionId];
  const secProgress = progress[sectionId] || {};

  items.forEach((item, idx)=>{
    const card = buildQuestionCard(sectionId, idx, item, secProgress[idx]);
    container.appendChild(card);
  });
  updateSectionCount(sectionId);
}

function buildQuestionCard(sectionId, idx, item, savedEntry){
  const card = document.createElement('div');
  card.className = 'q-card';
  card.dataset.section = sectionId;
  card.dataset.idx = idx;

  const num = document.createElement('div');
  num.className = 'q-num';
  num.textContent = labelFor(sectionId) + ' — Q' + (idx+1);
  card.appendChild(num);

  const qtext = document.createElement('div');
  qtext.className = 'q-text';
  qtext.textContent = item[0];
  card.appendChild(qtext);

  if(sectionId==='fib' || sectionId==='oneword'){
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = 'Type your answer...';
    if(savedEntry && savedEntry.userVal!==undefined) inp.value = savedEntry.userVal;
    card.appendChild(inp);
    const btn = document.createElement('button');
    btn.className = 'check-btn';
    btn.textContent = 'Check';
    card.appendChild(btn);
    const fb = document.createElement('div');
    fb.className = 'feedback';
    card.appendChild(fb);
    const showFeedback = (correct)=>{
      fb.className = 'feedback ' + (correct?'correct':'wrong');
      fb.textContent = correct ? 'Correct! ✓' : ('Not quite. Correct answer: ' + item[1]);
    };
    btn.onclick = ()=>{
      const correct = normalize(inp.value) === normalize(item[1]);
      showFeedback(correct);
      saveAnswer(sectionId, idx, correct, inp.value);
      updateSectionCount(sectionId);
      updateScore();
    };
    if(savedEntry && savedEntry.attempted) showFeedback(savedEntry.correct);
  }
  else if(sectionId==='mcq'){
    const optsDiv = document.createElement('div');
    optsDiv.className = 'opts';
    item[1].forEach((opt,oi)=>{
      const label = document.createElement('label');
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'mcq-'+idx;
      radio.value = oi;
      if(savedEntry && String(savedEntry.userVal)===String(oi)) radio.checked = true;
      label.appendChild(radio);
      label.appendChild(document.createTextNode(opt));
      optsDiv.appendChild(label);
    });
    card.appendChild(optsDiv);
    const btn = document.createElement('button');
    btn.className = 'check-btn';
    btn.textContent = 'Check';
    card.appendChild(btn);
    const fb = document.createElement('div');
    fb.className = 'feedback';
    card.appendChild(fb);
    const showFeedback = (correct)=>{
      fb.className = 'feedback ' + (correct?'correct':'wrong');
      fb.textContent = correct ? 'Correct! ✓' : ('Correct answer: ' + item[1][item[2]]);
    };
    btn.onclick = ()=>{
      const sel = card.querySelector('input[name="mcq-'+idx+'"]:checked');
      if(!sel){ fb.className='feedback wrong'; fb.textContent='Please select an option.'; return; }
      const correct = parseInt(sel.value) === item[2];
      showFeedback(correct);
      saveAnswer(sectionId, idx, correct, sel.value);
      updateSectionCount(sectionId);
      updateScore();
    };
    if(savedEntry && savedEntry.attempted) showFeedback(savedEntry.correct);
  }
  else if(sectionId==='tf'){
    const btns = document.createElement('div');
    btns.className = 'tf-btns';
    const tBtn = document.createElement('button'); tBtn.textContent='True';
    const fBtn = document.createElement('button'); fBtn.textContent='False';
    btns.appendChild(tBtn); btns.appendChild(fBtn);
    card.appendChild(btns);
    const fb = document.createElement('div');
    fb.className = 'feedback';
    card.appendChild(fb);
    const showFeedback = (correct)=>{
      fb.className = 'feedback ' + (correct?'correct':'wrong');
      fb.textContent = correct ? 'Correct! ✓' : ('Correct answer: ' + (item[1] ? 'True' : 'False'));
    };
    const pick = (val, btnEl)=>{
      [tBtn,fBtn].forEach(b=>b.classList.remove('sel'));
      btnEl.classList.add('sel');
      const correct = (val === item[1]);
      showFeedback(correct);
      saveAnswer(sectionId, idx, correct, val);
      updateSectionCount(sectionId);
      updateScore();
    };
    tBtn.onclick = ()=> pick(true, tBtn);
    fBtn.onclick = ()=> pick(false, fBtn);
    if(savedEntry && savedEntry.attempted){
      if(savedEntry.userVal===true) tBtn.classList.add('sel');
      else if(savedEntry.userVal===false) fBtn.classList.add('sel');
      showFeedback(savedEntry.correct);
    }
  }
  else if(sectionId==='defs' || sectionId==='qa' || sectionId==='reasoning'){
    const ta = document.createElement('input');
    ta.type = 'text';
    ta.placeholder = 'Type your answer, then reveal the model answer...';
    if(savedEntry && savedEntry.userVal!==undefined) ta.value = savedEntry.userVal;
    card.appendChild(ta);
    const btn = document.createElement('button');
    btn.className = 'check-btn';
    btn.textContent = 'Reveal Answer';
    card.appendChild(btn);
    const ans = document.createElement('div');
    ans.className = 'def-answer answer-key';
    ans.style.display = 'none';
    ans.textContent = 'Model answer: ' + item[1];
    card.appendChild(ans);
    btn.onclick = ()=>{
      ans.style.display = 'block';
      saveAnswer(sectionId, idx, null, ta.value, true);
      updateSectionCount(sectionId);
    };
    if(savedEntry && savedEntry.revealed) ans.style.display = 'block';
  }

  return card;
}

function labelFor(sectionId){
  const s = SECTIONS.find(x=>x.id===sectionId);
  return s ? s.label : sectionId;
}

function updateSectionCount(sectionId){
  const el = document.getElementById('count-'+sectionId);
  if(!el) return;
  const secProgress = progress[sectionId] || {};
  const answered = Object.values(secProgress).filter(e=>e.attempted).length;
  el.textContent = answered + ' / ' + DATA[sectionId].length + ' answered';
}

function updateScore(){
  let total = 0, correct = 0;
  SECTIONS.forEach(sec=>{
    if(UNSCORED_SECTIONS.includes(sec.id)) return;
    const items = DATA[sec.id];
    total += items.length;
    const secProgress = progress[sec.id] || {};
    Object.values(secProgress).forEach(e=>{ if(e.correct) correct++; });
  });
  document.getElementById('overallScore').textContent = correct + ' / ' + total;
}

/* ================== RESET ================== */
function resetSection(sectionId){
  if(!confirm('Reset all answers in this section? This cannot be undone.')) return;
  delete progress[sectionId];
  persist();
  renderList(sectionId);
  updateScore();
  if(VOICE_SECTIONS.includes(sectionId)){
    endActiveVoiceRoundIfAny(false);
    if(viewMode[sectionId]==='voice') renderVoiceStartScreen(sectionId);
  }
}
function resetAll(){
  if(!confirm('This will clear ALL your saved answers across every section. Continue?')) return;
  progress = {};
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  SECTIONS.forEach(sec=> renderList(sec.id));
  updateScore();
  endActiveVoiceRoundIfAny(false);
  VOICE_SECTIONS.forEach(id=>{ if(viewMode[id]==='voice') renderVoiceStartScreen(id); });
}

/* ================== VOICE ROUND ================== */
function endActiveVoiceRoundIfAny(cancelSpeech){
  if(voiceState && voiceState.recognition){
    try{ voiceState.recognition.abort(); }catch(e){}
  }
  if(cancelSpeech && window.speechSynthesis){
    try{ window.speechSynthesis.cancel(); }catch(e){}
  }
  voiceState = null;
}

function renderVoiceStartScreen(sectionId){
  const container = document.getElementById('voicewrap-'+sectionId);
  container.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'voice-wrap';
  const p = document.createElement('p');
  p.style.fontFamily = "'Nunito',sans-serif";
  p.textContent = 'Hands-free mode: I will read each question aloud, then listen for your spoken answer.';
  const btn = document.createElement('button');
  btn.className = 'voice-start-btn';
  btn.textContent = 'Start Voice Round';
  btn.onclick = ()=> startVoiceRound(sectionId, container);
  box.appendChild(p);
  box.appendChild(btn);
  container.appendChild(box);
}

function requestMicAccess(){
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    return Promise.resolve(false);
  }
  return navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    stream.getTracks().forEach(t=>t.stop());
    return true;
  }).catch(()=> false);
}

function renderMicError(sectionId, container){
  container.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'mic-error-box';
  const heading = document.createElement('strong');
  heading.textContent = 'Microphone access is unavailable.';
  const introText = document.createTextNode(' This is usually one of two things:');
  const ul = document.createElement('ul');
  const li1 = document.createElement('li');
  li1.textContent = 'The browser app itself has not been given microphone permission at the operating-system level.';
  const li2 = document.createElement('li');
  li2.textContent = "This page has already been blocked from using the microphone in your browser's own site settings.";
  ul.appendChild(li1); ul.appendChild(li2);
  const followUp = document.createElement('div');
  followUp.textContent = 'Please check those settings, then try again.';
  box.appendChild(heading);
  box.appendChild(introText);
  box.appendChild(ul);
  box.appendChild(followUp);
  const btn = document.createElement('button');
  btn.textContent = 'Try again';
  btn.onclick = ()=> startVoiceRound(sectionId, container);
  box.appendChild(btn);
  container.appendChild(box);
}

function startVoiceRound(sectionId, container){
  requestMicAccess().then(ok=>{
    if(!ok){ renderMicError(sectionId, container); return; }
    const order = DATA[sectionId].map((_,i)=>i);
    voiceState = { sectionId, container, order, pos:0, correctCount:0, attempted:0, recognition:null, token:0 };
    renderVoiceQuestion();
  });
}

function buildVoiceStage(){
  const vs = voiceState;
  const container = vs.container;
  container.innerHTML = ''; // never stack stages - single container, always cleared first
  const stage = document.createElement('div');
  stage.className = 'voice-stage';

  const numEl = document.createElement('div');
  numEl.className = 'voice-q-num';
  numEl.textContent = labelFor(vs.sectionId) + ' — Question ' + (vs.pos+1) + ' of ' + vs.order.length;
  stage.appendChild(numEl);

  const qTextEl = document.createElement('div');
  qTextEl.className = 'voice-q-text';
  stage.appendChild(qTextEl);

  const statusEl = document.createElement('div');
  statusEl.className = 'voice-status';
  statusEl.textContent = 'Getting ready…';
  stage.appendChild(statusEl);

  const controls = document.createElement('div');
  controls.className = 'voice-controls';
  const skipBtn = document.createElement('button');
  skipBtn.textContent = 'Skip';
  const endBtn = document.createElement('button');
  endBtn.className = 'danger';
  endBtn.textContent = 'End Round';
  controls.appendChild(skipBtn);
  controls.appendChild(endBtn);
  stage.appendChild(controls);

  container.appendChild(stage);

  // scope listeners to the stage element just created
  skipBtn.addEventListener('click', ()=> handleSkip(stage));
  endBtn.addEventListener('click', ()=> handleEndRound());

  return { stage, qTextEl, statusEl };
}

function renderVoiceQuestion(){
  const vs = voiceState;
  if(!vs) return;
  if(vs.pos >= vs.order.length){
    renderVoiceSummary();
    return;
  }
  vs.token = (vs.token||0) + 1;
  const myToken = vs.token;

  const idx = vs.order[vs.pos];
  const item = DATA[vs.sectionId][idx];
  const refs = buildVoiceStage();

  let displayText = item[0];
  let speechText = item[0];
  if(vs.sectionId==='fib'){
    speechText = speechTextForFib(item[0]);
  }
  // TF: read ONLY the statement, no "true or false" appended (item[0] already is just the statement)

  refs.qTextEl.textContent = displayText;
  refs.statusEl.textContent = 'Reading question…';

  speakThenListen(speechText, refs, myToken, (transcript)=>{
    if(!voiceState || voiceState.token !== myToken) return; // stale callback, ignore
    evaluateVoiceAnswer(vs.sectionId, idx, item, transcript, refs, myToken);
  });
}

function speakThenListen(speechText, refs, myToken, onTranscript){
  let listeningStarted = false;

  const beginListening = ()=>{
    if(listeningStarted) return;
    if(!voiceState || voiceState.token !== myToken) return; // round moved on/ended already
    listeningStarted = true;
    beginRecognition(refs, myToken, onTranscript);
  };

  if(window.speechSynthesis){
    try{ window.speechSynthesis.cancel(); }catch(e){}
    const utter = new SpeechSynthesisUtterance(speechText);
    const words = speechText.trim().split(/\s+/);
    const lastWord = words[words.length-1] || '';
    const lastWordStart = Math.max(0, speechText.length - lastWord.length);
    utter.onboundary = (e)=>{
      if(typeof e.charIndex === 'number' && e.charIndex >= lastWordStart){
        beginListening();
      }
    };
    utter.onend = ()=>{ beginListening(); };
    utter.onerror = ()=>{ beginListening(); };
    try{
      window.speechSynthesis.speak(utter);
    }catch(e){
      beginListening();
    }
  } else {
    // no TTS support at all - go straight to listening
    beginListening();
  }
}

function beginRecognition(refs, myToken, onTranscript){
  const vs = voiceState;
  if(!vs || vs.token !== myToken) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  refs.statusEl.innerHTML = '<span class="mic-pulse"></span>Listening… (5 seconds)';

  if(!SR){
    // no speech recognition support - can't capture a spoken answer
    setTimeout(()=>{
      if(voiceState && voiceState.token === myToken) onTranscript(null);
    }, 300);
    return;
  }

  const recognition = new SR();
  vs.recognition = recognition;
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  let heard = false;
  let finished = false;

  const finish = (transcript)=>{
    if(finished) return;
    finished = true;
    clearTimeout(timeoutId);
    try{ recognition.onresult = null; recognition.onend = null; recognition.onerror = null; }catch(e){}
    if(!voiceState || voiceState.token !== myToken) return; // round moved on/ended - drop stale result
    onTranscript(transcript);
  };

  recognition.onresult = (e)=>{
    heard = true;
    const transcript = e.results && e.results[0] && e.results[0][0] ? e.results[0][0].transcript : '';
    finish(transcript);
  };
  recognition.onerror = ()=>{
    if(!heard) finish(null);
  };
  recognition.onend = ()=>{
    if(!heard) finish(null);
  };

  const timeoutId = setTimeout(()=>{
    if(!heard){
      try{ recognition.stop(); }catch(e){}
      // if onend doesn't fire quickly enough, force resolution
      setTimeout(()=>{ if(!finished) finish(null); }, 400);
    }
  }, 5000);

  try{
    recognition.start();
  }catch(e){
    finish(null);
  }
}

function evaluateVoiceAnswer(sectionId, idx, item, transcript, refs, myToken){
  const vs = voiceState;
  if(!vs || vs.token !== myToken) return;
  let correct = false;
  let correctAnswerDisplay = '';

  if(sectionId==='fib' || sectionId==='oneword'){
    correctAnswerDisplay = item[1];
    correct = transcript ? fuzzyMatch(transcript, item[1]) : false;
  } else if(sectionId==='tf'){
    correctAnswerDisplay = item[1] ? 'True' : 'False';
    if(transcript){
      const t = normalize(transcript);
      const saysTrue = /\btrue\b/.test(t);
      const saysFalse = /\bfalse\b/.test(t);
      if(saysTrue && !saysFalse) correct = (item[1] === true);
      else if(saysFalse && !saysTrue) correct = (item[1] === false);
      else correct = false;
    } else {
      correct = false;
    }
  }

  vs.attempted++;
  if(correct) vs.correctCount++;
  saveAnswer(sectionId, idx, correct, transcript, false);
  updateSectionCount(sectionId);
  updateScore();

  refs.statusEl.className = 'voice-status ' + (correct ? 'correct' : 'wrong');
  if(!transcript){
    refs.statusEl.textContent = 'No answer heard. Correct answer: ' + correctAnswerDisplay;
  } else if(correct){
    refs.statusEl.textContent = 'Correct! ✓';
  } else {
    refs.statusEl.textContent = 'Not quite. Correct answer: ' + correctAnswerDisplay;
  }

  const feedbackSpeech = correct ? 'Correct!' : ('The correct answer is: ' + correctAnswerDisplay);
  const advance = ()=> advanceVoiceRound(myToken);
  if(window.speechSynthesis){
    try{
      window.speechSynthesis.cancel();
      const utter2 = new SpeechSynthesisUtterance(feedbackSpeech);
      utter2.onend = advance;
      utter2.onerror = advance;
      window.speechSynthesis.speak(utter2);
    }catch(e){
      setTimeout(advance, 1600);
    }
  } else {
    setTimeout(advance, 1600);
  }
}

function advanceVoiceRound(myToken){
  if(!voiceState) return;
  if(typeof myToken === 'number' && voiceState.token !== myToken) return; // round moved on/ended already
  voiceState.pos++;
  renderVoiceQuestion();
}

function handleSkip(stageEl){
  const vs = voiceState;
  if(!vs) return;
  vs.token = (vs.token||0) + 1; // invalidate any in-flight recognition/speech callbacks
  if(vs.recognition){
    try{ vs.recognition.abort(); }catch(e){}
  }
  if(window.speechSynthesis){
    try{ window.speechSynthesis.cancel(); }catch(e){}
  }
  vs.pos++;
  renderVoiceQuestion();
}

function handleEndRound(){
  const vs = voiceState;
  if(!vs) return;
  vs.token = (vs.token||0) + 1; // invalidate any in-flight recognition/speech callbacks
  if(vs.recognition){
    try{ vs.recognition.abort(); }catch(e){}
  }
  if(window.speechSynthesis){
    try{ window.speechSynthesis.cancel(); }catch(e){}
  }
  renderVoiceSummary();
}

function renderVoiceSummary(){
  const vs = voiceState;
  if(!vs) return;
  const container = vs.container;
  container.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'voice-stage voice-summary';

  const title = document.createElement('div');
  title.style.fontFamily = "'Nunito',sans-serif";
  title.style.fontWeight = '700';
  title.textContent = 'Voice Round Complete';
  box.appendChild(title);

  const scoreEl = document.createElement('div');
  scoreEl.className = 'big-score';
  scoreEl.textContent = vs.correctCount + ' / ' + vs.attempted + ' correct';
  box.appendChild(scoreEl);

  const btns = document.createElement('div');
  btns.className = 'voice-summary-btns';
  const redoBtn = document.createElement('button');
  redoBtn.textContent = 'Redo Round';
  redoBtn.addEventListener('click', ()=> startVoiceRound(vs.sectionId, container));
  const listBtn = document.createElement('button');
  listBtn.textContent = 'Return to List View';
  listBtn.addEventListener('click', ()=>{
    const sid = vs.sectionId;
    voiceState = null;
    switchMode(sid, 'list');
    renderList(sid);
  });
  btns.appendChild(redoBtn);
  btns.appendChild(listBtn);
  box.appendChild(btns);

  container.appendChild(box);
  if(voiceState){
    voiceState.recognition = null;
    voiceState.token = (voiceState.token||0) + 1; // ensure summary state can't be clobbered by late callbacks
  }
}

/* ================== INIT ================== */
function init(){
  loadProgress();
  buildTabs();
  buildSections();
  showSection(SECTIONS[0].id);
  updateScore();
  document.getElementById('resetAllBtn').onclick = resetAll;
  document.getElementById('loadingNote').style.display = 'none';
}

init();
</script>
