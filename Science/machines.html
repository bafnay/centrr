let activeCat = 'fib';
const state = {}; // state[catKey] = { responses: { id: {value, correct} } }
CATEGORIES.forEach(c => state[c.key] = {responses:{}});

// Voice Round: only these three sections get the List View / Voice Round toggle.
const VOICE_CATS = ['fib', 'oneword', 'tf'];
const LISTEN_TIMEOUT_MS = 5000;   // fixed 5s answer window, timed from listening start
const ADVANCE_DELAY_MS = 1800;    // pause on feedback before auto-advancing
const voiceMode = {};             // voiceMode[catKey] = 'list' | 'voice'
VOICE_CATS.forEach(k => voiceMode[k] = 'list');
let vr = null; // the single active voice-round controller, or null when no round is running

// Everything is persisted in one localStorage entry, namespaced to this
// chapter's quiz so it never collides with another chapter's quiz hosted
// on the same site/origin.
const STORAGE_KEY = 'quiz-progress-machines-ch11';

function loadState(){
  let raw = null;
  try{
    raw = localStorage.getItem(STORAGE_KEY);
  }catch(e){
    console.error('localStorage is unavailable — starting without saved progress.', e);
    return;
  }
  if(!raw) return;
  let parsed = null;
  try{
    parsed = JSON.parse(raw);
  }catch(e){
    console.error('Saved progress was corrupted — starting fresh.', e);
    return;
  }
  if(!parsed || typeof parsed !== 'object') return;
  CATEGORIES.forEach(c=>{
    const saved = parsed[c.key];
    if(saved && saved.responses && typeof saved.responses === 'object'){
      state[c.key] = saved;
    }
  });
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Could not save progress to localStorage.', e);
  }
}

function resetCat(catKey){
  if(vr && vr.catKey === catKey) cleanupVoiceRound();
  state[catKey] = {responses:{}};
  saveState();
  render();
}

function resetAll(){
  if(vr) cleanupVoiceRound();
  CATEGORIES.forEach(c => state[c.key] = {responses:{}});
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){ /* nothing to clear */ }
  render();
}

loadState(); // restore any saved progress before the very first render

/* ---------------------------------------------------------
   GRADING
--------------------------------------------------------- */
function norm(s){
  return (s||'').toString().trim().toLowerCase().replace(/[^\w\s]/g,'').replace(/\s+/g,' ');
}
function textMatches(userVal, answers){
  const u = norm(userVal);
  if(!u) return false;
  return answers.some(a=>{
    const an = norm(a);
    return u === an || u.includes(an) || an.includes(u);
  });
}

/* ---------------------------------------------------------
   SCORING
--------------------------------------------------------- */
function catScore(catKey){
  const items = DATA[catKey];
  const responses = state[catKey].responses;
  let correct = 0, answered = 0;
  items.forEach(it=>{
    const r = responses[it.id];
    if(r && r.correct !== null && r.correct !== undefined){
      answered++;
      if(r.correct) correct++;
    }
  });
  return {correct, answered, total: items.length};
}
function overallScore(){
  let correct=0, total=0;
  CATEGORIES.forEach(c=>{ const s = catScore(c.key); correct+=s.correct; total+=s.total; });
  return {correct, total};
}

/* ---------------------------------------------------------
   RENDER
--------------------------------------------------------- */
function render(){
  renderOverall();
  renderTabs();
  renderPanel();
}

function renderOverall(){
  const o = overallScore();
  const totalQuestions = CATEGORIES.reduce((sum, c) => sum + DATA[c.key].length, 0);
  document.getElementById('overallBox').innerHTML =
    `<span class="pill">TOTAL &nbsp;${o.correct} / ${o.total} correct</span>
     <span class="pill">${totalQuestions} questions across ${CATEGORIES.length} sections</span>
     <button class="action reset" id="resetAllBtn">Reset all answers</button>`;
  document.getElementById('resetAllBtn').onclick = ()=>{
    if(confirm('Reset ALL answers and progress across every section? This cannot be undone.')){
      resetAll();
    }
  };
}

function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  CATEGORIES.forEach(c=>{
    const s = catScore(c.key);
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (c.key===activeCat ? ' active' : '');
    btn.innerHTML = `<span class="code">${c.code}</span><span class="name">${c.name}</span><span class="score">${s.correct}/${s.total}</span>`;
    btn.onclick = ()=>{
      cleanupVoiceRound(); // stop any speech/recognition before we tear this panel down
      activeCat = c.key;
      render();
    };
    nav.appendChild(btn);
  });
}

function renderPanel(){
  const main = document.getElementById('main');
  const cat = CATEGORIES.find(c=>c.key===activeCat);
  const items = DATA[activeCat];
  const s = catScore(activeCat);
  const voiceCapable = VOICE_CATS.includes(activeCat);

  let html = '';
  html += `<div class="panel-head">
      <div><h2>${cat.name}</h2><p class="desc">${cat.desc}</p></div>
      <div class="panel-score-block">
        <div class="panel-score">Score: ${s.correct} / ${s.total} &nbsp;\u00b7&nbsp; ${s.answered} answered</div>
        <button class="action reset small" id="resetSectionBtn">Reset section</button>
      </div>
    </div>`;

  if(voiceCapable){
    html += `<div class="mode-toggle-row">
        <div class="mode-toggle">
          <button class="mode-btn ${voiceMode[cat.key]==='list' ? 'active' : ''}" data-mode="list">List View</button>
          <button class="mode-btn ${voiceMode[cat.key]==='voice' ? 'active' : ''}" data-mode="voice">Voice Round</button>
        </div>
      </div>`;
  }

  if(voiceCapable && voiceMode[cat.key] === 'voice'){
    html += `<div id="voiceRoundRoot" class="voice-root"></div>`;
    main.innerHTML = html;
    wireModeToggle(cat.key);
    wireSectionReset(cat.key);
    const container = document.getElementById('voiceRoundRoot');
    setStage(container, buildVoiceIdleStage(cat.key));
    return; // Voice Round manages its own DOM from here — skip list rendering
  }

  html += `<div class="btn-row">
      <button class="action" id="checkAllBtn">Check all answered</button>
    </div>`;

  let lastGroup = null;
  items.forEach(it=>{
    if(it.group && it.group !== lastGroup){
      lastGroup = it.group;
      html += `<div class="group-title">${it.group}</div>`;
      if(it.svg){
        html += `<div class="svg-wrap">${SVGS[it.svg]}</div>`;
      }
    }
    html += renderItem(cat.key, it);
  });

  main.innerHTML = html;

  if(voiceCapable) wireModeToggle(cat.key);
  wireSectionReset(cat.key);

  document.getElementById('checkAllBtn').onclick = ()=> checkAll(cat.key);

  wireItemEvents(cat.key, items);
}

function wireSectionReset(catKey){
  const btn = document.getElementById('resetSectionBtn');
  if(!btn) return;
  const cat = CATEGORIES.find(c=>c.key===catKey);
  btn.onclick = ()=>{
    if(confirm('Reset all answers and scores for "' + cat.name + '"? This cannot be undone.')){
      resetCat(catKey);
    }
  };
}

function wireModeToggle(catKey){
  document.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const mode = btn.dataset.mode;
      if(mode === voiceMode[catKey]) return;
      cleanupVoiceRound();
      voiceMode[catKey] = mode;
      render();
    });
  });
}

function renderItem(catKey, it){
  const kind = kindOf(catKey);
  const r = state[catKey].responses[it.id] || {};
  let body = '';

  if(kind === 'blank'){
    const val = r.value !== undefined ? r.value : '';
    body = `<input type="text" data-id="${it.id}" class="blank-input" placeholder="Type your answer…" value="${escapeHtml(val)}">
      <div class="row-actions"><button class="check" data-check="${it.id}">Check</button></div>
      ${feedbackHtml(r, it.answers)}`;
  } else if(kind === 'mcq'){
    const opts = it.options.map((opt,idx)=>{
      let cls='opt-btn';
      if(r.selected===idx){
        cls += (r.correct===true) ? ' correct' : (r.correct===false ? ' incorrect' : ' selected');
      } else if(r.checked && idx===it.correct){
        cls += ' correct';
      }
      return `<button class="${cls}" data-opt="${idx}" data-id="${it.id}">${opt}</button>`;
    }).join('');
    body = `<div class="options">${opts}</div>
      ${r.checked ? feedbackFor(r.correct, it.options[it.correct]) : ''}`;
  } else if(kind === 'tf'){
    const mkBtn = (val,label)=>{
      let cls='tf-btn';
      if(r.selected===val){
        cls += (r.correct===true) ? ' correct' : (r.correct===false ? ' incorrect' : ' selected');
      } else if(r.checked && it.answer===val){
        cls += ' correct';
      }
      return `<button class="${cls}" data-tf="${val}" data-id="${it.id}">${label}</button>`;
    };
    body = `<div class="tf-row">${mkBtn(true,'True')}${mkBtn(false,'False')}</div>
      ${r.checked ? feedbackFor(r.correct, it.answer ? 'True' : 'False') : ''}`;
  } else if(kind === 'reveal'){
    const val = r.value !== undefined ? r.value : '';
    body = `<textarea data-id="${it.id}" class="reveal-input" placeholder="Write your answer here…">${escapeHtml(val)}</textarea>
      <div class="row-actions">
        <button class="check" data-reveal="${it.id}">${r.revealed ? 'Hide' : 'Show'} model answer</button>
      </div>
      ${r.revealed ? `<div class="model-answer"><span class="lbl">FROM THE TEXTBOOK</span>${it.model}</div>
        <div class="row-actions">
          <button class="check mark-correct" data-mark="${it.id}" data-val="true">I got this right</button>
          <button class="check mark-incorrect" data-mark="${it.id}" data-val="false">I need to review</button>
        </div>
        ${r.correct!==undefined && r.correct!==null ? `<div class="feedback ${r.correct?'correct':'incorrect'}">${r.correct?'Marked correct.':'Marked for review — take another look above.'}</div>` : ''}
      ` : ''}`;
  }

  return `<div class="card">
      <span class="qnum">${it.id.toUpperCase()}</span>
      <p class="prompt">${it.prompt}</p>
      ${body}
    </div>`;
}

function feedbackHtml(r, answers){
  if(r.checked === undefined) return '';
  return feedbackFor(r.correct, answers[0]);
}
function feedbackFor(correct, correctAnswerText){
  if(correct === undefined || correct === null) return '';
  return `<div class="feedback ${correct?'correct':'incorrect'}">
      ${correct ? 'Correct!' : 'Not quite.'}
      ${!correct ? `<span class="ans">Correct answer: ${correctAnswerText}</span>` : ''}
    </div>`;
}

function kindOf(catKey){
  if(catKey==='mcq') return 'mcq';
  if(catKey==='tf') return 'tf';
  if(catKey==='def' || catKey==='shortqa' || catKey==='reasoning') return 'reveal';
  return 'blank'; // fib, oneword, distinguish, labeling
}

function escapeHtml(s){
  return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------------------------------------------------------
   EVENTS
--------------------------------------------------------- */
function wireItemEvents(catKey, items){
  const byId = {};
  items.forEach(it=>byId[it.id]=it);

  document.querySelectorAll('.blank-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const id = e.target.dataset.id;
      const resp = state[catKey].responses[id] || {};
      resp.value = e.target.value;
      state[catKey].responses[id] = resp;
      saveState();
    });
  });
  document.querySelectorAll('[data-check]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const id = e.target.dataset.check;
      checkBlank(catKey, byId[id]);
    });
  });
  document.querySelectorAll('[data-opt]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const id = e.target.dataset.id;
      const idx = parseInt(e.target.dataset.opt,10);
      const it = byId[id];
      const resp = state[catKey].responses[id] || {};
      resp.selected = idx;
      resp.checked = true;
      resp.correct = (idx === it.correct);
      state[catKey].responses[id] = resp;
      saveState();
      render();
    });
  });
  document.querySelectorAll('[data-tf]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const id = e.target.dataset.id;
      const val = e.target.dataset.tf === 'true';
      const it = byId[id];
      const resp = state[catKey].responses[id] || {};
      resp.selected = val;
      resp.checked = true;
      resp.correct = (val === it.answer);
      state[catKey].responses[id] = resp;
      saveState();
      render();
    });
  });
  document.querySelectorAll('.reveal-input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const id = e.target.dataset.id;
      const resp = state[catKey].responses[id] || {};
      resp.value = e.target.value;
      state[catKey].responses[id] = resp;
      saveState();
    });
  });
  document.querySelectorAll('[data-reveal]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const id = e.target.dataset.reveal;
      const resp = state[catKey].responses[id] || {};
      resp.revealed = !resp.revealed;
      state[catKey].responses[id] = resp;
      saveState();
      render();
    });
  });
  document.querySelectorAll('[data-mark]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const id = e.target.dataset.mark;
      const val = e.target.dataset.val === 'true';
      const resp = state[catKey].responses[id] || {};
      resp.correct = val;
      state[catKey].responses[id] = resp;
      saveState();
      render();
    });
  });
}

function checkBlank(catKey, it){
  const resp = state[catKey].responses[it.id] || {};
  resp.checked = true;
  resp.correct = textMatches(resp.value, it.answers);
  state[catKey].responses[it.id] = resp;
  saveState();
  render();
}

function checkAll(catKey){
  const kind = kindOf(catKey);
  if(kind !== 'blank'){ return; } // mcq/tf/reveal are checked per-item by design
  DATA[catKey].forEach(it=>{
    const resp = state[catKey].responses[it.id];
    if(resp && resp.value && resp.value.trim() && !resp.checked){
      resp.checked = true;
      resp.correct = textMatches(resp.value, it.answers);
    }
  });
  saveState();
  render();
}

/* ---------------------------------------------------------
   VOICE ROUND
   A hands-free, one-question-at-a-time flow for Fill in the
   Blanks, One Word, and True/False. Reuses the same grading
   helpers and the same state[catKey].responses store as List
   View, so scores and persistence stay in sync either way.
--------------------------------------------------------- */

function setStage(container, el){
  // Always remove whatever was there first — never stack question stages.
  if(!container) return;
  container.innerHTML = '';
  container.appendChild(el);
}

function supportsVoice(){
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  return !!(Recognition && window.speechSynthesis && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

function parseTF(transcript){
  const n = norm(transcript);
  if(!n) return null;
  if(/\bfalse\b/.test(n)) return false;
  if(/\btrue\b/.test(n)) return true;
  return null;
}

function gradeVoiceAnswer(catKey, item, transcript){
  const resp = state[catKey].responses[item.id] || {};
  let correct, correctText;
  if(catKey === 'tf'){
    const parsed = parseTF(transcript);
    resp.selected = parsed;
    resp.checked = true;
    correct = (parsed !== null) && (parsed === item.answer);
    resp.correct = correct;
    correctText = item.answer ? 'True' : 'False';
  } else {
    resp.value = transcript || '';
    resp.checked = true;
    correct = transcript ? textMatches(transcript, item.answers) : false;
    resp.correct = correct;
    correctText = item.answers[0];
  }
  state[catKey].responses[item.id] = resp;
  saveState();
  return {correct, correctText};
}

function cleanupCurrentQuestionAudio(){
  if(!vr) return;
  vr.token = (vr.token || 0) + 1; // invalidate any in-flight callbacks from the old question
  if(vr.timerId){ clearTimeout(vr.timerId); vr.timerId = null; }
  if(vr.recognition){
    try{
      vr.recognition.onstart = null;
      vr.recognition.onresult = null;
      vr.recognition.onerror = null;
      vr.recognition.onend = null;
      vr.recognition.stop();
    }catch(e){ /* recognition may already be stopped */ }
    vr.recognition = null;
  }
  if(window.speechSynthesis){
    try{ window.speechSynthesis.cancel(); }catch(e){ /* not supported */ }
  }
}

function cleanupVoiceRound(){
  if(vr){
    cleanupCurrentQuestionAudio();
    vr.ended = true;
  }
  vr = null;
}

function switchToListView(catKey){
  cleanupVoiceRound();
  voiceMode[catKey] = 'list';
  render();
}

function buildVoiceIdleStage(catKey){
  const stage = document.createElement('div');
  stage.className = 'voice-stage voice-idle';
  if(!supportsVoice()){
    stage.innerHTML = `
      <div class="voice-icon">🎙️</div>
      <p class="voice-copy"><strong>Voice Round isn't supported in this browser.</strong> It needs speech recognition (Chrome, Edge, or Safari) on a secure, https page. List View works everywhere.</p>
      <button class="action" data-action="back">Back to List View</button>`;
    stage.querySelector('[data-action="back"]').addEventListener('click', ()=> switchToListView(catKey));
    return stage;
  }
  stage.innerHTML = `
    <div class="voice-icon">🎙️</div>
    <p class="voice-copy">Voice Round reads each question aloud and listens for your spoken answer — hands-free, one question at a time. It needs microphone access to start.</p>
    <button class="action voice-primary" data-action="start">Start Voice Round</button>`;
  stage.querySelector('[data-action="start"]').addEventListener('click', ()=> beginVoiceRound(catKey));
  return stage;
}

function buildPermissionErrorStage(catKey){
  const stage = document.createElement('div');
  stage.className = 'voice-stage voice-error';
  stage.innerHTML = `
    <p class="voice-copy"><strong>Couldn't access the microphone.</strong></p>
    <p class="voice-copy">This is usually one of two things:</p>
    <ul class="voice-list">
      <li>This app hasn't been given microphone permission at the device/OS level yet.</li>
      <li>This page was already blocked from using the microphone in the browser's own site settings.</li>
    </ul>
    <div class="row-actions">
      <button class="action voice-primary" data-action="retry">Try again</button>
      <button class="action" data-action="back">Back to List View</button>
    </div>`;
  stage.querySelector('[data-action="retry"]').addEventListener('click', ()=> beginVoiceRound(catKey));
  stage.querySelector('[data-action="back"]').addEventListener('click', ()=> switchToListView(catKey));
  return stage;
}

function buildQuestionStage(catKey, item, idx, total){
  const stage = document.createElement('div');
  stage.className = 'voice-stage voice-question';
  stage.innerHTML = `
    <div class="voice-progress">QUESTION ${idx+1} OF ${total}</div>
    <p class="voice-question-text">${item.prompt}</p>
    <p class="voice-status">Reading question…</p>
    <p class="voice-timer"></p>
    <div class="row-actions">
      <button class="action" data-action="skip">Skip</button>
      <button class="action reset" data-action="end">End round</button>
    </div>`;
  stage.querySelector('[data-action="skip"]').addEventListener('click', ()=> skipCurrentQuestion(catKey));
  stage.querySelector('[data-action="end"]').addEventListener('click', ()=> endVoiceRoundEarly(catKey));
  return stage;
}

function buildSummaryStage(catKey, correctCount, attempted, total){
  const stage = document.createElement('div');
  stage.className = 'voice-stage voice-summary';
  const skipped = total - attempted;
  stage.innerHTML = `
    <h3 class="voice-summary-title">Round complete</h3>
    <p class="voice-summary-score">${correctCount} / ${attempted} correct${skipped > 0 ? ` &nbsp;·&nbsp; ${skipped} skipped` : ''}</p>
    <div class="row-actions">
      <button class="action voice-primary" data-action="redo">Redo round</button>
      <button class="action" data-action="list">Return to List View</button>
    </div>`;
  stage.querySelector('[data-action="redo"]').addEventListener('click', ()=> beginVoiceRound(catKey));
  stage.querySelector('[data-action="list"]').addEventListener('click', ()=> switchToListView(catKey));
  return stage;
}

async function beginVoiceRound(catKey){
  cleanupVoiceRound();
  const container = document.getElementById('voiceRoundRoot');
  if(!container) return;

  if(!supportsVoice()){
    setStage(container, buildVoiceIdleStage(catKey));
    return;
  }

  const asking = document.createElement('div');
  asking.className = 'voice-stage voice-idle';
  asking.innerHTML = `<div class="voice-icon">🎙️</div><p class="voice-copy">Requesting microphone access…</p>`;
  setStage(container, asking);

  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>{ try{ t.stop(); }catch(e){} });
  }catch(e){
    // Container may have changed (user navigated away) while we were awaiting permission.
    const c2 = document.getElementById('voiceRoundRoot');
    if(c2) setStage(c2, buildPermissionErrorStage(catKey));
    return;
  }

  const c2 = document.getElementById('voiceRoundRoot');
  if(!c2) return; // user left this section while permission was pending

  vr = {catKey, index:0, correctCount:0, attempted:0, ended:false, recognition:null, timerId:null, token:0};
  runVoiceQuestion(catKey, 0);
}

function toSpeechText(text){
  // Fill-in-the-blank prompts contain a run of 3+ underscores for the
  // visual blank (different questions use different exact counts). Left
  // as-is, TTS engines read that aloud as "underscore underscore...".
  // Swap any such run for the spoken word "blank" instead — this only
  // changes what gets spoken; the on-screen prompt is untouched.
  return text.replace(/_{3,}/g, ' blank ').replace(/\s+/g, ' ').trim();
}

function runVoiceQuestion(catKey, idx){
  if(!vr || vr.catKey !== catKey) return;
  const container = document.getElementById('voiceRoundRoot');
  if(!container) return;

  vr.token = (vr.token || 0) + 1;
  const myToken = vr.token;
  vr.index = idx;

  const items = DATA[catKey];
  const item = items[idx];
  const stage = buildQuestionStage(catKey, item, idx, items.length);
  setStage(container, stage);

  const statusEl = stage.querySelector('.voice-status');
  let started = false;

  const beginListening = ()=>{
    if(!vr || vr.ended || vr.token !== myToken || started) return;
    started = true;
    if(statusEl) statusEl.textContent = 'Listening… speak now';
    startListening(catKey, idx, stage, myToken);
  };

  if(!window.speechSynthesis){
    // No TTS available on this device/browser — go straight to listening.
    beginListening();
    return;
  }

  try{ window.speechSynthesis.cancel(); }catch(e){ /* not supported */ }

  const text = toSpeechText(item.prompt);
  const trimmed = text.replace(/\s+$/, '');
  const lastSpace = trimmed.lastIndexOf(' ');
  const lastWordStart = lastSpace === -1 ? 0 : lastSpace + 1;

  const utter = new SpeechSynthesisUtterance(text);
  utter.onboundary = (e)=>{
    if(!vr || vr.ended || vr.token !== myToken || started) return;
    if(typeof e.charIndex === 'number' && e.charIndex >= lastWordStart){
      beginListening();
    }
  };
  utter.onend = ()=>{
    // Fallback for voices/platforms that never fire onboundary.
    beginListening();
  };
  utter.onerror = ()=>{
    beginListening();
  };

  if(statusEl) statusEl.textContent = 'Reading question…';
  try{
    window.speechSynthesis.speak(utter);
  }catch(e){
    beginListening();
  }
}

function startListening(catKey, idx, stage, myToken){
  if(!vr || vr.ended || vr.token !== myToken) return;
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Recognition){
    finishQuestion(catKey, idx, stage, '', myToken);
    return;
  }

  const recognition = new Recognition();
  vr.recognition = recognition;
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  let finished = false;
  const timerEl = stage.querySelector('.voice-timer');

  const finalize = (transcript)=>{
    if(finished || !vr || vr.ended || vr.token !== myToken) return;
    finished = true;
    if(vr.timerId){ clearTimeout(vr.timerId); vr.timerId = null; }
    finishQuestion(catKey, idx, stage, transcript, myToken);
  };

  recognition.onstart = ()=>{
    if(!vr || vr.ended || vr.token !== myToken) return;
    // Fixed 5-second window, timed from the moment listening actually begins.
    vr.timerId = setTimeout(()=> finalize(''), LISTEN_TIMEOUT_MS);
    if(timerEl) timerEl.textContent = 'Listening…';
  };
  recognition.onresult = (e)=>{
    const transcript = (e.results && e.results[0] && e.results[0][0]) ? e.results[0][0].transcript : '';
    finalize(transcript);
  };
  recognition.onerror = ()=> finalize('');
  recognition.onend = ()=> finalize(''); // natural end-of-speech with no result yet -> no answer

  try{
    recognition.start();
  }catch(e){
    finalize('');
  }
}

function finishQuestion(catKey, idx, stage, transcript, myToken){
  if(!vr || vr.ended || vr.token !== myToken) return;
  const items = DATA[catKey];
  const item = items[idx];
  const {correct, correctText} = gradeVoiceAnswer(catKey, item, transcript);

  vr.attempted++;
  if(correct) vr.correctCount++;

  // Keep the header/tab scores live without touching the voice stage itself.
  renderTabs();
  renderOverall();

  const statusEl = stage.querySelector('.voice-status');
  const timerEl = stage.querySelector('.voice-timer');
  if(timerEl) timerEl.textContent = '';
  if(statusEl){
    statusEl.className = 'voice-status ' + (correct ? 'correct' : 'incorrect');
    statusEl.textContent = correct
      ? 'Correct!'
      : (transcript ? `Not quite — correct answer: ${correctText}` : `No answer heard — correct answer: ${correctText}`);
  }

  if(window.speechSynthesis){
    try{
      window.speechSynthesis.cancel();
      const fb = new SpeechSynthesisUtterance(correct ? 'Correct!' : `Correct answer: ${correctText}`);
      window.speechSynthesis.speak(fb);
    }catch(e){ /* not supported */ }
  }

  vr.timerId = setTimeout(()=>{
    if(!vr || vr.ended || vr.token !== myToken) return;
    advanceVoiceRound(catKey);
  }, ADVANCE_DELAY_MS);
}

function advanceVoiceRound(catKey){
  if(!vr || vr.ended || vr.catKey !== catKey) return;
  const items = DATA[catKey];
  const nextIdx = vr.index + 1;
  if(nextIdx >= items.length){
    showVoiceSummary(catKey);
  } else {
    runVoiceQuestion(catKey, nextIdx);
  }
}

function skipCurrentQuestion(catKey){
  if(!vr || vr.ended || vr.catKey !== catKey) return;
  cleanupCurrentQuestionAudio();
  advanceVoiceRound(catKey);
}

function endVoiceRoundEarly(catKey){
  if(!vr || vr.ended || vr.catKey !== catKey) return;
  cleanupCurrentQuestionAudio();
  showVoiceSummary(catKey);
}

function showVoiceSummary(catKey){
  if(!vr) return;
  const correctCount = vr.correctCount;
  const attempted = vr.attempted;
  const total = DATA[catKey].length;
  vr.ended = true;
  vr = null;

  const container = document.getElementById('voiceRoundRoot');
  if(!container) return; // user already navigated away
  setStage(container, buildSummaryStage(catKey, correctCount, attempted, total));
  renderTabs();
  renderOverall();
}

/* ---------------------------------------------------------
   INIT
--------------------------------------------------------- */
render(); // state was already restored from localStorage by loadState() above

// Don't leave the mic listening in the background if the app is hidden or closed.
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) cleanupVoiceRound();
});
window.addEventListener('pagehide', cleanupVoiceRound);
window.addEventListener('beforeunload', cleanupVoiceRound);
</script>
</body>
</html>
