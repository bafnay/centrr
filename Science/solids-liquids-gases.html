 a:"Density here follows from how tightly molecules are packed and how strongly they attract each other. Solids have molecules closely packed with strong attraction, making them densest. Liquids have loosely packed molecules with weaker attraction, so they are less dense than solids. Gases have very loosely packed molecules with very weak attraction, making them the least dense of the three."},
{q:"Water is used as the chapter's example for showing all three states of matter. Explain, using the freezing/melting/evaporation/condensation definitions, how the same water sample can visit all three states in a cycle.",
 a:"Water in liquid form can be cooled to become ice (freezing = liquid to solid) or heated to become steam (evaporation = liquid to gas). Ice can be heated back into water (melting = solid to liquid), and steam can be cooled back into water (condensation = gas to liquid). Because each of these processes can reverse into the other, the same water can cycle repeatedly through solid, liquid and gas."},
{q:"Camphor and naphthalene are both given as examples of sublimation. Using the definition of sublimation and the fact that solids normally have no intermolecular spaces, explain what makes these substances unusual.",
 a:"Sublimation is a solid converting directly into gas without passing through the liquid state. Normally a solid would need to melt first before it could evaporate into gas. Camphor and naphthalene skip the liquid stage entirely, converting straight from the tightly packed solid state to the widely spaced gas state."},
{q:"Ice-sellers sprinkle salt on ice, and the chapter explains this lowers the melting point of ice. Explain why lowering the melting point helps prevent the ice from melting as quickly at normal outdoor temperatures.",
 a:"Melting happens once ice reaches its melting point. Salt lowers this melting point, meaning the ice needs to reach an even lower temperature before it can melt. Since the surrounding temperature doesn't change, reaching that lower melting point takes longer, so under everyday conditions the melting is slowed down / prevented."},
{q:"A gas leak in the kitchen can be smelled in the bedroom. Combine the fact about gas molecule diffusion with the fact about the added foul-smelling compound to explain how this detection works.",
 a:"Cooking gas has ethyl mercaptan added to it, which produces a strong smell. Because gas molecules are loosely packed and can easily diffuse (spread out) into the air in all directions, the smelly gas molecules travel from the kitchen through the air until they reach the bedroom, allowing the leak to be smelled far from its source."},
{q:"The chapter defines elements, compounds and mixtures by whether atoms are combined. Using water and a salt-water mixture as the chapter's own examples, explain the key difference between a compound and a mixture.",
 a:"A compound is made of more than one kind of atom that are chemically combined together — water is the example, made of hydrogen and oxygen atoms combined. A mixture is also made of more than one kind of atom, but they are NOT combined together — a mixture of salt and water is the example, where the atoms simply mix without forming a new combined substance."},
{q:"Using the convection-current explanation given for ventilators and exhaust fans, explain why fresh air keeps entering a room even though nothing is pushing it in from outside.",
 a:"The air we exhale (or the warm air in a kitchen/washroom) is warm, and warm air rises. As this warm air rises and escapes through ventilators or exhaust fans, it leaves behind less air in the room. Fresh air from the door then moves in to take its place — this movement, driven purely by warm air rising and being replaced, is what the chapter calls a convection current."},
{q:"Both sea breeze and land breeze are described as convection currents, but they occur at opposite times of day and in opposite directions. Explain why, using the differences in how fast land and sea heat up and cool down.",
 a:"Land heats up faster than the sea during the day, so the air over the hot land rises and cooler air from the sea moves in to replace it — this is the sea breeze. At night, the land also cools down faster than the sea, so the air over the now-warmer sea rises, and cooler air from the land moves out to replace it — this is the land breeze. Because land's temperature changes faster than the sea's in both directions, the direction of airflow reverses between day and night."},
{q:"Nitrogen and oxygen together make up most of the air, according to the percentages given in the chapter. Using those percentages, explain roughly what fraction of air is made up of gases other than nitrogen and oxygen.",
 a:"Nitrogen makes up about 78.09% of air and oxygen makes up about 20.95%. Added together, these two gases make up about 99.04% of air, leaving only a small remainder (roughly under 1%) for carbon dioxide, water vapour, rare gases and impurities combined."},
{q:"The chapter says wind speed can range from 5–10 km/h for a gentle breeze up to 700–800 km/h for a tornado. Using the definition of wind as moving air, explain what this range tells us about how differently air can move.",
 a:"Wind is simply air that is blowing or moving. The huge range from a gentle breeze (5–10 km/h) to a tornado (700–800 km/h) shows that the same basic phenomenon — moving air — can occur at vastly different intensities, from barely noticeable to extremely destructive, depending on how fast the air is moving."},
{q:"A vapour is described as a mixture of liquid and gas phases, formed when a solid or liquid changes into gaseous form under special conditions. Using the sublimation and evaporation definitions, explain how water vapour and naphthalene fumes are both examples of 'vapour' even though they come from different states of matter.",
 a:"Water vapour forms when liquid water evaporates into gas, while naphthalene fumes form when solid naphthalene sublimes directly into gas. Even though one starts as a liquid and the other as a solid, both end up as a gas/moisture phase mixed into the air, which is exactly what the chapter defines as a vapour — so both fit the definition despite starting from different states."},
{q:"Liquids are described as flowing from high level to low level and taking the shape of their container. Using both of these facts, explain why liquids can be poured from one container into a differently-shaped container and still settle into a stable, flat-topped shape.",
 a:"Because liquid molecules are loosely packed and not fixed in position, the liquid can flow and take on the shape of whatever container it is poured into. At the same time, liquids naturally flow from a higher level to a lower level, so once poured in, the liquid settles downward and spreads into a flat, stable surface inside its new container."},
{q:"The chapter states that solids have a fixed shape and geometry, while gases take the shape of any container they are put in. Using the molecule-packing explanation, explain why solids resist changing shape but gases don't.",
 a:"Solid molecules are closely packed with no intermolecular spaces and strongly attracted to each other, which locks them into a fixed arrangement, giving solids a fixed shape that resists change. Gas molecules, in contrast, are very loosely packed with huge intermolecular spaces and very weak attraction, so they are free to spread out and completely fill whatever shape of container they are placed in."},
{q:"Using the definitions of soluble and insoluble substances, explain what determines whether a substance added to water will dissolve.",
 a:"The chapter defines soluble substances as those that dissolve rapidly in water, and insoluble substances as those that dissolve very little or do not seem to dissolve at all. So whether a substance is 'soluble' or 'insoluble' is essentially defined by how much and how quickly it dissolves when mixed with water."},
{q:"Both condensation (droplets forming on a cold glass of ice) and sublimation (naphthalene balls shrinking) involve a change of state without any liquid pouring or visible boiling. Explain what's actually happening in each case using the chapter's definitions.",
 a:"Condensation is the conversion of gas into liquid — water vapour present in the air turns into liquid droplets when it touches the cold surface of the glass. Sublimation is a solid converting directly into gas — naphthalene balls slowly turn into vapour and escape into the air, which is why they shrink over time. Although neither involves obvious pouring or boiling, both are still genuine changes of state, just moving in different directions (gas→liquid vs solid→gas)."},
{q:"Using the tyre example and the general property of gases being compressible, explain why filling a tyre with air (a gas) makes it both stiff and able to absorb bumps.",
 a:"Air is a gas, and gases can be compressed easily because their molecules are very loosely packed with huge intermolecular spaces. When air is pumped into a tyre, this compressibility lets the air cushion and absorb shocks from bumps, while still filling the tyre firmly enough to make it stiff and reduce its contact area with the road."},
{q:"The chapter explains that matter can be 'perceived by the senses' and gives air as an example that can't be seen but can still be classified as matter. Combine this with the balloon activities to explain which senses could actually detect air, even though sight cannot.",
 a:"Although air cannot be seen, the balloon activities show it can be felt (its weight bends the scale) and its effect can be seen indirectly (the balloon inflating). So even though sight alone doesn't reveal air directly, feeling its weight/resistance and observing its effects let the senses perceive that air is present, satisfying the 'perceived by senses' part of the definition of matter."},
{q:"Using the description of exhaust fans and ventilators, explain why both are placed near the ceiling rather than near the floor.",
 a:"The chapter explains that warm air rises. Since exhaust fans and ventilators are meant to remove warm air from a room (like in kitchens, washrooms, or after exhaling), they need to be positioned where the warm air naturally collects — near the ceiling — so the rising warm air can escape through them efficiently."},
{q:"Explain why the chapter describes land and sea breeze as convection currents specifically, rather than just calling them 'wind.'",
 a:"Wind is simply any moving air, but convection currents specifically involve warm air rising and cooler air moving in to replace it. Land and sea breezes follow exactly this pattern — warm air over the warmer surface (land by day, sea by night) rises, and cooler air from the other side moves in to take its place — so they are convection currents, a specific cause-and-effect type of wind, not just random air movement."},
{q:"Using the examples given for elements (hydrogen), compounds (water) and mixtures (salt and water), explain why water counts as a compound but salt water does not.",
 a:"Water is made of hydrogen and oxygen atoms that are chemically combined together into a new single substance, which is what makes something a compound. Salt water is just salt and water mixed together without the atoms combining into a new substance — the salt and water each keep their own separate identity, which is what makes it a mixture instead of a compound."},

/* ============ STORAGE (plain localStorage, single key per chapter) ============
   This file is hosted as a normal webpage (e.g. GitHub Pages over https), not a
   Claude.ai artifact, so plain localStorage is the right tool here. Everything for
   this chapter's quiz lives under ONE key so it never collides with other chapter
   quizzes hosted alongside it, and a single JSON blob makes save/restore simple. */
const CHAPTER_SLUG = "solids-liquids-gases";
const STORAGE_KEY = "quiz-progress-" + CHAPTER_SLUG;

let progressStore = {};
(function loadProgressStoreFromDisk(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) progressStore = JSON.parse(raw);
  }catch(e){
    // corrupted entry — start fresh rather than breaking the page
    progressStore = {};
  }
})();

function persistProgressStore(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progressStore)); }
  catch(e){ console.error("save failed", e); }
}

async function loadState(catId, fallback){
  if(progressStore[catId] !== undefined && progressStore[catId] !== null) return progressStore[catId];
  return fallback;
}
async function saveState(catId, stateObj){
  progressStore[catId] = stateObj;
  persistProgressStore();
}
async function clearState(catId){
  delete progressStore[catId];
  persistProgressStore();
}

// Kept for compatibility with code that flushes state before the page is hidden/closed —
// with plain localStorage every save is already synchronous, so this just re-persists once.
function flushAllSaves(){
  persistProgressStore();
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="hidden"){ flushAllSaves(); stopAllVoiceRounds(); }
});
window.addEventListener("pagehide", ()=>{ flushAllSaves(); stopAllVoiceRounds(); });
window.addEventListener("blur", flushAllSaves);

function normalize(str){
  return (str||"").toLowerCase().replace(/[^a-z0-9. ]/g," ").replace(/\s+/g," ").trim();
}
function answerMatches(user, correct){
  const u = normalize(user);
  if(!u) return false;
  if(Array.isArray(correct)){
    // all listed tokens must appear somewhere in user's text (any order) OR user matches any single accepted phrase
    const anyWhole = correct.some(c => normalize(c) === u);
    if(anyWhole) return true;
    return correct.every(c => u.includes(normalize(c)));
  }
  const c = normalize(correct);
  return u === c || u.includes(c) || c.includes(u);
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1600);
}
function formatCorrectAnswer(a){
  return Array.isArray(a) ? a.join(" / ") : a;
}

/* ============ VOICE ROUND (shared engine for Fill Blank / One Word / True-False) ============
   Only these three sections get a "Voice Round" mode; MCQ, Definitions, Short Answer,
   Distinguish and Labeling are untouched. Existing question data/coverage is never modified —
   this just adds a hands-free way to answer the same questions. */

const voiceRounds = {}; // catId -> round-state object

function speechSupported(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  return !!(SR && window.speechSynthesis);
}

// Ask for mic permission up-front (spec requirement) and immediately release the stream.
async function checkMicAccess(){
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error("getUserMedia unavailable");
    }
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>{ try{ t.stop(); }catch(e){} });
    return {ok:true};
  }catch(e){
    return {ok:false, error:e};
  }
}

// Tear down whatever is in-flight for one round (recognition + timers + any speech)
// without touching anything else. Safe to call multiple times.
function teardownVoiceQuestion(vr){
  if(vr.timeoutId){ clearTimeout(vr.timeoutId); vr.timeoutId = null; }
  if(vr.recognition){
    const r = vr.recognition;
    vr.recognition = null;
    try{ r.onresult = null; r.onerror = null; r.onend = null; r.stop(); }catch(e){}
  }
  if(window.speechSynthesis){
    try{ window.speechSynthesis.cancel(); }catch(e){}
  }
}

function stopAllVoiceRounds(){
  Object.keys(voiceRounds).forEach(catId=>{
    const vr = voiceRounds[catId];
    if(vr){ teardownVoiceQuestion(vr); vr.active = false; }
  });
}

// Builds the "List View / Voice Round" toggle row. Listeners are attached directly to the
// button elements this function creates and returns — never looked up later via getElementById.
function buildModeToggleRow(onSwitchToVoice, onSwitchToList){
  const row = document.createElement("div");
  row.className = "mode-toggle-row";
  const wrap = document.createElement("div");
  wrap.className = "mode-toggle";
  const listBtn = document.createElement("button");
  listBtn.type = "button"; listBtn.className = "mode-btn active"; listBtn.textContent = "📋 List View";
  const voiceBtn = document.createElement("button");
  voiceBtn.type = "button"; voiceBtn.className = "mode-btn"; voiceBtn.textContent = "🎙️ Voice Round";
  wrap.appendChild(listBtn); wrap.appendChild(voiceBtn);
  row.appendChild(wrap);

  listBtn.addEventListener("click", ()=>{
    if(listBtn.classList.contains("active")) return;
    listBtn.classList.add("active"); voiceBtn.classList.remove("active");
    onSwitchToList();
  });
  voiceBtn.addEventListener("click", ()=>{
    if(voiceBtn.classList.contains("active")) return;
    voiceBtn.classList.add("active"); listBtn.classList.remove("active");
    onSwitchToVoice();
  });
  return {row, listBtn, voiceBtn};
}

// Attaches the toggle row + Voice Round wrapper to an already-built panel.
// sectionEl: the <section class="panel"> element (already appended to the DOM)
// listWrapEl: the wrapper div holding the existing list-view UI for this category
function setupVoiceRound(catId, items, config, sectionEl, listWrapEl){
  const voiceWrap = document.createElement("div");
  voiceWrap.id = "voicewrap-" + catId;
  voiceWrap.className = "voice-wrap hidden";

  const controlsBar = document.createElement("div");
  controlsBar.className = "voice-controls-bar";
  const progressSpan = document.createElement("span");
  progressSpan.className = "voice-progress";
  progressSpan.textContent = "Ready when you are";
  const skipBtn = document.createElement("button");
  skipBtn.type = "button"; skipBtn.className = "action voice-skip-btn"; skipBtn.textContent = "⏭ Skip";
  const endBtn = document.createElement("button");
  endBtn.type = "button"; endBtn.className = "action voice-end-btn"; endBtn.textContent = "⏹ End Round";
  controlsBar.appendChild(progressSpan);
  controlsBar.appendChild(skipBtn);
  controlsBar.appendChild(endBtn);

  const stageEl = document.createElement("div");
  stageEl.className = "voice-stage";

  voiceWrap.appendChild(controlsBar);
  voiceWrap.appendChild(stageEl);
  sectionEl.appendChild(voiceWrap);

  const vr = {
    catId, items, config,
    index: 0, score: 0, active: false, listeningStarted: false, answered: false,
    stageEl, progressSpan, skipBtn, endBtn,
    listWrapEl, voiceWrapEl: voiceWrap,
    recognition: null, timeoutId: null,
    listToggleBtn: null, voiceToggleBtn: null,
  };
  voiceRounds[catId] = vr;

  const toggle = buildModeToggleRow(
    ()=> switchToVoiceView(vr),
    ()=> switchToListView(vr)
  );
  vr.listToggleBtn = toggle.listBtn;
  vr.voiceToggleBtn = toggle.voiceBtn;
  sectionEl.insertBefore(toggle.row, listWrapEl);

  skipBtn.addEventListener("click", ()=>{
    if(!vr.active) return;
    teardownVoiceQuestion(vr);
    vr.index++;
    askQuestion(vr);
  });
  endBtn.addEventListener("click", ()=>{
    endVoiceRound(vr);
  });
}

function switchToVoiceView(vr){
  vr.listWrapEl.classList.add("hidden");
  vr.voiceWrapEl.classList.remove("hidden");
  if(!speechSupported()){
    renderVoiceUnsupported(vr);
    return;
  }
  startVoiceRoundFlow(vr);
}

function switchToListView(vr){
  teardownVoiceQuestion(vr);
  vr.active = false;
  vr.voiceWrapEl.classList.add("hidden");
  vr.listWrapEl.classList.remove("hidden");
  if(vr.listToggleBtn && vr.voiceToggleBtn){
    vr.listToggleBtn.classList.add("active");
    vr.voiceToggleBtn.classList.remove("active");
  }
}

function renderVoiceUnsupported(vr){
  vr.stageEl.innerHTML = "";
  const card = document.createElement("div");
  card.className = "voice-card voice-error";
  card.innerHTML = `<div class="voice-error-title">🎙️ Voice Round isn't supported here</div>
    <div class="voice-error-body">This browser doesn't support the speech recognition and
    speech synthesis features Voice Round needs. Try Chrome or Edge on desktop, or Chrome on Android.</div>`;
  const backBtn = document.createElement("button");
  backBtn.type = "button"; backBtn.className = "action reset"; backBtn.textContent = "📋 Return to List View";
  card.appendChild(backBtn);
  vr.stageEl.appendChild(card);
  vr.progressSpan.textContent = "Not available in this browser";
  backBtn.addEventListener("click", ()=> switchToListView(vr));
}

async function startVoiceRoundFlow(vr){
  vr.index = 0; vr.score = 0; vr.active = true;
  vr.stageEl.innerHTML = "";
  const waitCard = document.createElement("div");
  waitCard.className = "voice-card";
  waitCard.innerHTML = `<div class="voice-status">🎤 Requesting microphone access…</div>`;
  vr.stageEl.appendChild(waitCard);
  vr.progressSpan.textContent = "Getting ready…";

  const micResult = await checkMicAccess();
  if(!vr.active) return; // round was ended/left while waiting on permission
  if(!micResult.ok){
    renderMicError(vr);
    return;
  }
  askQuestion(vr);
}

function renderMicError(vr){
  vr.stageEl.innerHTML = "";
  const card = document.createElement("div");
  card.className = "voice-card voice-error";
  card.innerHTML = `<div class="voice-error-title">🎤 Couldn't access the microphone</div>
    <div class="voice-error-body">This is usually one of two things:<br><br>
    1. The browser (or the app it's running inside) doesn't have microphone permission
    turned on at the device/OS level.<br><br>
    2. This page was already blocked from using the microphone in the browser's own
    site settings.<br><br>
    Please check permissions, then try again.</div>`;
  const retryBtn = document.createElement("button");
  retryBtn.type = "button"; retryBtn.className = "action check"; retryBtn.textContent = "Try Again";
  card.appendChild(retryBtn);
  vr.stageEl.appendChild(card);
  vr.progressSpan.textContent = "Microphone access needed";
  retryBtn.addEventListener("click", ()=> startVoiceRoundFlow(vr));
}

function askQuestion(vr){
  teardownVoiceQuestion(vr); // never let a previous question's listener/timer/speech linger
  if(!vr.active) return;
  if(vr.index >= vr.items.length){
    showVoiceSummary(vr);
    return;
  }
  vr.answered = false;
  vr.listeningStarted = false;
  const item = vr.items[vr.index];
  const questionText = vr.config.getQuestionText(item);

  vr.progressSpan.textContent = `Question ${vr.index+1} of ${vr.items.length} · Score ${vr.score}`;

  vr.stageEl.innerHTML = ""; // exactly one question-stage element in the DOM at a time
  const card = document.createElement("div");
  card.className = "voice-card";
  card.innerHTML = `<div class="voice-qtext">${questionText}</div>
    <div class="voice-status">🔊 Reading question…</div>
    <div class="voice-feedback"></div>`;
  vr.stageEl.appendChild(card);
  const statusEl = card.querySelector(".voice-status");
  const feedbackEl = card.querySelector(".voice-feedback");

  speakQuestionThenListen(vr, questionText, statusEl, feedbackEl, item);
}

function speakQuestionThenListen(vr, text, statusEl, feedbackEl, item){
  if(!window.speechSynthesis){
    beginListening(vr, statusEl, feedbackEl, item);
    return;
  }
  try{ window.speechSynthesis.cancel(); }catch(e){}

  const utter = new SpeechSynthesisUtterance(text);
  const trimmed = text.trim();
  const lastSpaceIdx = trimmed.lastIndexOf(" ");
  const lastWordStart = lastSpaceIdx === -1 ? 0 : lastSpaceIdx + 1;

  const tryStart = ()=>{
    if(vr.listeningStarted || !vr.active) return;
    vr.listeningStarted = true;
    beginListening(vr, statusEl, feedbackEl, item);
  };

  // Start listening a fraction of a second early — right as the LAST word begins —
  // on browsers that report word boundaries. Never start any earlier than that,
  // to avoid the mic picking up the device's own speaker output.
  utter.onboundary = (e)=>{
    if(typeof e.charIndex === "number" && e.charIndex >= lastWordStart){
      tryStart();
    }
  };
  // Reliable fallback for platforms where onboundary never fires (most mobile TTS voices).
  utter.onend = ()=> tryStart();
  utter.onerror = ()=> tryStart();

  window.speechSynthesis.speak(utter);
}

function beginListening(vr, statusEl, feedbackEl, item){
  if(!vr.active) return;
  statusEl.textContent = "🎙️ Listening… (5 seconds)";
  statusEl.classList.add("listening");

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    handleVoiceAnswer(vr, null, statusEl, feedbackEl, item);
    return;
  }

  const recognition = new SR();
  recognition.lang = "en-US";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  vr.recognition = recognition;

  const finish = (transcript)=>{
    if(vr.answered) return;
    vr.answered = true;
    if(vr.timeoutId){ clearTimeout(vr.timeoutId); vr.timeoutId = null; }
    if(vr.recognition){
      const r = vr.recognition; vr.recognition = null;
      try{ r.onresult = null; r.onerror = null; r.onend = null; r.stop(); }catch(e){}
    }
    handleVoiceAnswer(vr, transcript, statusEl, feedbackEl, item);
  };

  recognition.onresult = (event)=>{
    const transcript = (event.results && event.results[0] && event.results[0][0])
      ? event.results[0][0].transcript : "";
    finish(transcript);
  };
  recognition.onerror = ()=> finish(null);
  recognition.onend = ()=> finish(null); // idempotent thanks to vr.answered guard

  // Fixed 5-second window timed from the moment listening actually begins.
  vr.timeoutId = setTimeout(()=> finish(null), 5000);

  try{
    recognition.start();
  }catch(e){
    finish(null);
  }
}

function handleVoiceAnswer(vr, transcript, statusEl, feedbackEl, item){
  if(!vr.active) return;
  statusEl.classList.remove("listening");
  const heardSomething = !!(transcript && transcript.trim());
  const isCorrect = heardSomething ? vr.config.checkAnswer(transcript, item) : false;
  const correctText = vr.config.getCorrectAnswerText(item);

  statusEl.textContent = heardSomething ? `You said: "${transcript}"` : "🤔 No answer heard.";

  // Keep List View's persisted state (and, if it's already on screen, its inputs/buttons)
  // in sync with what was answered by voice — but only when something was actually heard,
  // so a timeout/no-answer never overwrites a previously typed answer.
  if(heardSomething && vr.config.syncAnswer){
    try{ vr.config.syncAnswer(vr.catId, vr.index, transcript, item); }catch(e){}
  }

  if(isCorrect){
    vr.score++;
    feedbackEl.innerHTML = `<span class="feedback correct">✔ Correct!</span>`;
    speakFeedbackThenNext(vr, "Correct!");
  } else {
    feedbackEl.innerHTML = `<span class="feedback incorrect">✘ Correct answer: ${correctText}</span>`;
    speakFeedbackThenNext(vr, `The correct answer is ${correctText}`);
  }
  vr.progressSpan.textContent = `Question ${vr.index+1} of ${vr.items.length} · Score ${vr.score}`;
}

function speakFeedbackThenNext(vr, text){
  const goNext = ()=>{
    if(!vr.active) return;
    vr.index++;
    setTimeout(()=> askQuestion(vr), 350);
  };
  if(!window.speechSynthesis){
    setTimeout(goNext, 900);
    return;
  }
  try{ window.speechSynthesis.cancel(); }catch(e){}
  const utter = new SpeechSynthesisUtterance(text);
  utter.onend = goNext;
  utter.onerror = goNext;
  window.speechSynthesis.speak(utter);
}

function endVoiceRound(vr){
  teardownVoiceQuestion(vr);
  showVoiceSummary(vr);
}

function showVoiceSummary(vr){
  vr.active = false;
  teardownVoiceQuestion(vr);
  vr.stageEl.innerHTML = "";
  const card = document.createElement("div");
  card.className = "voice-card voice-summary";
  card.innerHTML = `<div class="voice-summary-title">🏁 Round Complete</div>
    <div class="voice-summary-score">Score: ${vr.score} / ${vr.items.length}</div>`;
  const redoBtn = document.createElement("button");
  redoBtn.type = "button"; redoBtn.className = "action check"; redoBtn.textContent = "🔁 Redo Round";
  const listBtn = document.createElement("button");
  listBtn.type = "button"; listBtn.className = "action reset"; listBtn.textContent = "📋 Return to List View";
  card.appendChild(redoBtn); card.appendChild(listBtn);
  vr.stageEl.appendChild(card);
  vr.progressSpan.textContent = `Finished · Score ${vr.score}/${vr.items.length}`;

  redoBtn.addEventListener("click", ()=> startVoiceRoundFlow(vr));
  listBtn.addEventListener("click", ()=> switchToListView(vr));
}

/* ============ STATE ============ */
const state = {}; // per category runtime state
CATEGORIES.forEach(c=>state[c.id]={});
const categoryResetFns = {}; // catId -> reset function, used by per-section AND global reset

/* ============ RENDERERS ============ */

function catScoreLabel(catId){
  const s = state[catId] || {};
  if(!s.checked) return "Not checked yet";
  return `Score: ${s.score}/${s.total}`;
}

function renderTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  CATEGORIES.forEach((c,i)=>{
    const b = document.createElement("button");
    b.className = "tab-btn" + (i===0?" active":"");
    b.textContent = c.label;
    b.dataset.cat = c.id;
    b.onclick = ()=> switchTab(c.id);
    nav.appendChild(b);
  });
}

function switchTab(catId){
  flushAllSaves(); // make sure the section you're leaving is fully saved first
  stopAllVoiceRounds(); // don't let speech/mic keep running in a tab you've left
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active", b.dataset.cat===catId));
  document.querySelectorAll("section.panel").forEach(p=>p.classList.toggle("active", p.id==="panel-"+catId));
  updateOverallBar();
}

function updateOverallBar(){
  const bar = document.getElementById("overallBar");
  bar.innerHTML = CATEGORIES.map(c=>{
    const s = state[c.id] || {};
    const label = s.checked ? `${s.score}/${s.total}` : "–";
    return `<span class="pill">${c.label.split(" ")[0]} ${label}</span>`;
  }).join("");
}

      inp.addEventListener("input", ()=>{
        state[catId].answers = state[catId].answers || {};

      });
      const toggle = document.getElementById(`${catId}-toggle-${idx}`);

        gotBtn.classList.toggle("active", val==="got");

function recomputeRevealScore(catId, total){
  const grades = state[catId].grades || {};
  const score = Object.values(grades).filter(v=>v==="got").length;
  const gradedCount = Object.keys(grades).length;
  state[catId].checked = gradedCount>0;
  state[catId].score = score;
  state[catId].total = total;
  saveState(catId, state[catId]);
  document.getElementById("badge-"+catId).textContent = catScoreLabel(catId);
  updateOverallBar();
}

          <div class="dist-col"><h4>${item.left.h}</h4><ul>${item.left.pts.map(p=>`<li>${p}</li>`).join("")}</ul></div>
          <div class="dist-col"><h4>${item.right.h}</h4><ul>${item.right.pts.map(p=>`<li>${p}</li>`).join("")}</ul></div>
        </div>
      </div>
      <div class="self-grade">
        <button class="got" data-val="got" id="${catId}-got-${idx}">👍 I got this right</button>
        <button class="miss" data-val="miss" id="${catId}-miss-${idx}">🔁 Need to review</button>
      </div>`;
    list.appendChild(card);
  });

  loadState(catId,{grades:{}, revealed:{}, checked:false, score:0, total:items.length}).then(saved=>{
    state[catId]=saved;
    items.forEach((item,idx)=>{
      const toggle = document.getElementById(`${catId}-toggle-${idx}`);
      const revealBox = document.getElementById(`${catId}-reveal-${idx}`);
      if(saved.revealed && saved.revealed[idx]){
        revealBox.classList.add("show");
        toggle.textContent = "Hide Comparison";
      }
      toggle.addEventListener("click", ()=>{
        revealBox.classList.toggle("show");
        const isShown = revealBox.classList.contains("show");
        toggle.textContent = isShown ? "Hide Comparison" : "Show Comparison";
        state[catId].revealed = state[catId].revealed || {};
        state[catId].revealed[idx] = isShown;
        saveState(catId, state[catId]);
      });
      const gotBtn = document.getElementById(`${catId}-got-${idx}`);
      const missBtn = document.getElementById(`${catId}-miss-${idx}`);
      const applyGradeUi=(val)=>{
        gotBtn.classList.toggle("active", val==="got");
        missBtn.classList.toggle("active", val==="miss");
      };
      if(saved.grades && saved.grades[idx]) applyGradeUi(saved.grades[idx]);
      gotBtn.addEventListener("click", ()=>{
        state[catId].grades = state[catId].grades||{};
        state[catId].grades[idx]="got";
        applyGradeUi("got");
        recomputeRevealScore(catId, items.length);
      });
      missBtn.addEventListener("click", ()=>{
        state[catId].grades = state[catId].grades||{};
        state[catId].grades[idx]="miss";
        applyGradeUi("miss");
        recomputeRevealScore(catId, items.length);
      });
    });
    document.getElementById("badge-"+catId).textContent = catScoreLabel(catId);
    updateOverallBar();
  });

  document.getElementById("reset-"+catId).addEventListener("click", async ()=>{
    await doReset();
  });
  async function doReset(){
    await clearState(catId);
    state[catId]={grades:{}, revealed:{}, checked:false, score:0, total:items.length};
    items.forEach((item,idx)=>{
      document.getElementById(`${catId}-reveal-${idx}`).classList.remove("show");
      document.getElementById(`${catId}-toggle-${idx}`).textContent="Show Comparison";
      document.getElementById(`${catId}-got-${idx}`).classList.remove("active");
      document.getElementById(`${catId}-miss-${idx}`).classList.remove("active");
    });
    document.getElementById("badge-"+catId).textContent = catScoreLabel(catId);
    updateOverallBar();
    toast("Category reset");
  }
  categoryResetFns[catId] = doReset;
}

function buildLabelingPanel(){
  const catId="labeling";
  const totalBlanks = labelingDiagrams.reduce((sum,d)=>sum+d.blanks.length,0);
  const s = document.createElement("section");
  s.className="panel"; s.id="panel-"+catId;
  s.innerHTML = `<div class="panel-head"><h2>${CATEGORIES.find(c=>c.id===catId).label}</h2>
    <span class="score-badge" id="badge-${catId}">${catScoreLabel(catId)}</span></div>
    <div class="intro">Use the dropdowns to label each part of the diagrams, then tap Check Answers.</div>
    <div class="btnbar" style="margin-bottom:10px;">
      <button class="action check" id="check-${catId}">Check Answers</button>
      <button class="action reset" id="reset-${catId}">Reset This Category</button>
    </div>
    <div id="list-${catId}"></div>`;
  document.getElementById("main").appendChild(s);

  const list = document.getElementById("list-"+catId);
  labelingDiagrams.forEach((diag,di)=>{
    const card = document.createElement("div");
    card.className="card"; card.id=`${catId}-card-${di}`;
    let blanksHtml = diag.blanks.map((b,bi)=>`
      <div class="label-row">
        <span class="badge-num">${bi+1}</span>
        <span style="flex:1.4">${b.label}</span>
        <select id="${catId}-sel-${di}-${bi}">
          <option value="">Choose…</option>
          ${b.options.map(o=>`<option value="${o}">${o}</option>`).join("")}
        </select>
      </div>`).join("");
    card.innerHTML = `<div class="qtext">${diag.title}</div>${diag.svg}${blanksHtml}`;
    list.appendChild(card);
  });

  loadState(catId,{answers:{}, checked:false, score:0, total:totalBlanks}).then(saved=>{
    state[catId]=saved;
    labelingDiagrams.forEach((diag,di)=>{
      diag.blanks.forEach((b,bi)=>{
        const key = `${di}-${bi}`;
        const sel = document.getElementById(`${catId}-sel-${di}-${bi}`);
        if(saved.answers && saved.answers[key]) sel.value = saved.answers[key];
        sel.addEventListener("change", ()=>{
          state[catId].answers = state[catId].answers||{};
          state[catId].answers[key] = sel.value;
          saveState(catId, state[catId]);
        });
      });
    });
    if(saved.checked) applyLabelingChecked();
    document.getElementById("badge-"+catId).textContent = catScoreLabel(catId);
    updateOverallBar();
  });

  document.getElementById("check-"+catId).addEventListener("click", ()=>{
    let score=0;
    labelingDiagrams.forEach((diag,di)=>{
      diag.blanks.forEach((b,bi)=>{
        const key=`${di}-${bi}`;
        const val = state[catId].answers ? state[catId].answers[key] : "";
        if(val === b.a) score++;
      });
    });
    state[catId].checked=true; state[catId].score=score; state[catId].total=totalBlanks;
    saveState(catId, state[catId]);
    applyLabelingChecked();
    document.getElementById("badge-"+catId).textContent = catScoreLabel(catId);
    updateOverallBar();
    toast(`Scored ${score}/${totalBlanks}`);
  });

  document.getElementById("reset-"+catId).addEventListener("click", async ()=>{
    await doReset();
  });
  async function doReset(){
    await clearState(catId);
    state[catId]={answers:{}, checked:false, score:0, total:totalBlanks};
    labelingDiagrams.forEach((diag,di)=>{
      diag.blanks.forEach((b,bi)=>{

        sel.value=""; sel.style.borderColor="";
      });
      document.getElementById(`${catId}-card-${di}`).classList.remove("correct","incorrect");
    });
    document.getElementById("badge-"+catId).textContent = catScoreLabel(catId);
    updateOverallBar();
    toast("Category reset");
  }
  categoryResetFns[catId] = doReset;
}

function applyLabelingChecked(){
  let allGood = true;
  labelingDiagrams.forEach((diag,di)=>{
    let cardGood = true;
    diag.blanks.forEach((b,bi)=>{
      const key=`${di}-${bi}`;
      const sel = document.getElementById(`labeling-sel-${di}-${bi}`);
      const val = state.labeling.answers ? state.labeling.answers[key] : "";
      const correct = val === b.a;
      sel.style.borderColor = correct ? "#16a34a" : "#dc2626";
      if(!correct) cardGood = false;
    });
    document.getElementById(`labeling-card-${di}`).classList.remove("correct","incorrect");
    document.getElementById(`labeling-card-${di}`).classList.add(cardGood?"correct":"incorrect");
    if(!cardGood) allGood=false;
  });
}

/* ---- Voice Round configs (Fill Blanks / One Word / True-False only) ----
   Each config can optionally provide syncAnswer(catId, idx, transcript, item) so that
   whatever gets answered by voice is written back into the same persisted state (and,
   if already on screen, the same DOM inputs/buttons) List View uses — keeping the two
   modes in sync per requirement 8. */

function syncTextAnswer(catId, idx, transcript){
  state[catId] = state[catId] || {};
  state[catId].answers = state[catId].answers || {};
  state[catId].answers[idx] = transcript;
  saveState(catId, state[catId]);
  const inp = document.getElementById(`${catId}-input-${idx}`);
  if(inp) inp.value = transcript;
}

function parseTrueFalseFromTranscript(transcript){
  const t = transcript.toLowerCase();
  const hasTrue = /\btrue\b/.test(t);
  const hasFalse = /\bfalse\b/.test(t);
  if(hasFalse && !hasTrue) return false;
  if(hasTrue && !hasFalse) return true;
  return null; // ambiguous or neither keyword heard
}

function syncTFAnswer(catId, idx, boolVal){
  state[catId] = state[catId] || {};
  state[catId].answers = state[catId].answers || {};
  state[catId].answers[idx] = boolVal;
  saveState(catId, state[catId]);
  const wrap = document.getElementById(`${catId}-opts-${idx}`);
  if(wrap){
    [...wrap.children].forEach(btn=>{
      const val = btn.dataset.val === "true";
      btn.classList.toggle("selected", val===boolVal);
    });
  }
}

const fillBlankVoiceConfig = {
  // Don't read literal underscores aloud — normalize any run of 3+ underscores
  // (questions use varying counts) into a spoken "blank". Regex, not exact match,
  // so it catches every blank regardless of how many underscores it uses.
  getQuestionText: (item)=> item.q.replace(/_{3,}/g, "blank"),
  checkAnswer: (transcript, item)=> answerMatches(transcript, item.a),
  getCorrectAnswerText: (item)=> formatCorrectAnswer(item.a),
  syncAnswer: (catId, idx, transcript)=> syncTextAnswer(catId, idx, transcript),
};
const oneWordVoiceConfig = {
  getQuestionText: (item)=> item.q,
  checkAnswer: (transcript, item)=> answerMatches(transcript, item.a),
  getCorrectAnswerText: (item)=> formatCorrectAnswer(item.a),
  syncAnswer: (catId, idx, transcript)=> syncTextAnswer(catId, idx, transcript),
};
const trueFalseVoiceConfig = {
  getQuestionText: (item)=> item.s, // statement only — no "true, or false?" appended
  checkAnswer: (transcript, item)=>{
    const said = parseTrueFalseFromTranscript(transcript);
    if(said === null) return false;
    return said === item.a;
  },
  getCorrectAnswerText: (item)=> item.a ? "True" : "False",
  syncAnswer: (catId, idx, transcript)=>{
    const said = parseTrueFalseFromTranscript(transcript);
    if(said === null) return; // don't overwrite an existing answer with an ambiguous one
    syncTFAnswer(catId, idx, said);
  },
};

function init(){
  renderTabs();
  buildSimpleTextPanel("fillblank", fillBlanks, "q", fillBlankVoiceConfig);
  buildMcqPanel();
  buildSimpleTextPanel("oneword", oneWord, "q", oneWordVoiceConfig);
  buildRevealPanel("definitions", definitions, (item)=>`What is <b>${item.term}</b>?`);
  buildRevealPanel("shortanswer", shortAnswer, (item)=>item.q);
  buildRevealPanel("reasoning", reasoning, (item)=>item.q);
  buildTruefalsePanel(trueFalseVoiceConfig);
  buildDistinguishPanel();
  buildLabelingPanel();

  document.getElementById("panel-fillblank").classList.add("active");

  document.getElementById("resetAllBtn").addEventListener("click", ()=>{
    const proceed = (typeof window.confirm === "function")
      ? window.confirm("Reset ALL progress across every section? This can't be undone.")
      : true;
    if(!proceed) return;
    Object.values(categoryResetFns).forEach(fn=>{ try{ fn(); }catch(e){} });
    toast("All progress reset");
  });

  setTimeout(updateOverallBar, 400);
}
init();
