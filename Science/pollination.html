/* ============================= STORAGE =============================
   Progress is kept in localStorage under a single chapter-specific key,
   since this file is opened as a plain webpage (e.g. GitHub Pages), not
   inside a Claude.ai artifact — plain localStorage is what's available.
   stateCache mirrors that key's parsed contents in memory; every read/
   write goes through it, and every write is flushed straight to
   localStorage (writes are synchronous, so there's no race to worry
   about, unlike the artifact storage API used previously). */
const CHAPTER_SLUG = "pollination-ch4";
const STORAGE_KEY = "quiz-progress-" + CHAPTER_SLUG;

function loadAllProgress(){
  try{
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if(!raw) return {};
    const parsed = JSON.parse(raw);
    return (parsed && typeof parsed === 'object') ? parsed : {};
  }catch(e){
    // Missing or corrupted entry — start fresh rather than breaking the page.
    return {};
  }
}

function persistAllProgress(all){
  try{ window.localStorage.setItem(STORAGE_KEY, JSON.stringify(all)); }
  catch(e){ /* storage disabled or full — fail silently, in-memory state still works this session */ }
}

function loadState(cat){
  if(!stateCache[cat]) stateCache[cat] = {};
  return stateCache[cat];
}

function saveState(cat, state){
  stateCache[cat] = state;
  persistAllProgress(stateCache);
  return state;
}

function clearState(cat){
  stateCache[cat] = {};
  persistAllProgress(stateCache);
}

function resetAllProgress(){
  Object.keys(stateCache).forEach(k=>{ stateCache[k] = {}; });
  try{ window.localStorage.removeItem(STORAGE_KEY); }catch(e){ /* ignore */ }
}

function norm(s){ return (s||"").toString().trim().toLowerCase().replace(/\s+/g," "); }
function matchesAny(input, accepted){
  const n = norm(input);
  return accepted.some(a => norm(a) === n);
}

/* ============================= VOICE ROUND =============================
   A hands-free, single-question-at-a-time flow for Fill in the Blanks,
   One Word, and True/False. Only one "stage" element ever lives in the
   mount point: every transition clears it before appending the next.   */

// Fuzzy, normalized substring match — used for fill-in-blank / one-word voice answers.
function voiceFuzzyMatch(transcript, accepted){
  const n = norm(transcript);
  if(!n) return false;
  return accepted.some(a=>{
    const an = norm(a);
    return an.length>0 && (n === an || n.includes(an) || an.includes(n));
  });
}

// Keyword-based true/false detection from a spoken transcript.
function voiceTFCheck(transcript, expected){
  const n = norm(transcript);
  const hasTrue = /\btrue\b/.test(n);
  const hasFalse = /\bfalse\b/.test(n);
  if(hasTrue && !hasFalse) return expected === true;
  if(hasFalse && !hasTrue) return expected === false;
  return false; // neither/both keywords heard — treat as an incorrect (not "no answer") response
}

// One teardown hook for whatever Voice Round is currently active, if any.
// Called before switching tabs, switching back to List View, or re-rendering
// a tab, so speech never keeps talking/listening in the background.
let activeVoiceTeardown = null;
function teardownVoiceRound(){
  if(activeVoiceTeardown){
    try{ activeVoiceTeardown(); }catch(e){}
    activeVoiceTeardown = null;
  }
}

function createVoiceRoundController({ mountEl, items, onExit, onAnswer }){
  let idx = 0;
  let score = 0;
  let answered = 0;
  let sessionId = 0;          // bumped on every transition; stale async callbacks check against it
  let currentRecognition = null;
  let listenTimeoutId = null;

  function cleanup(){
    if(listenTimeoutId){ clearTimeout(listenTimeoutId); listenTimeoutId = null; }
    if(currentRecognition){
      try{
        currentRecognition.onresult = null;
        currentRecognition.onerror = null;
        currentRecognition.onend = null;
        currentRecognition.abort();
      }catch(e){ /* ignore */ }
      currentRecognition = null;
    }
    if(window.speechSynthesis){
      try{ window.speechSynthesis.cancel(); }catch(e){ /* ignore */ }
    }
  }

  function renderStage(builder){
    mountEl.innerHTML = ''; // remove the previous stage entirely — never stack stages
    const stage = document.createElement('div');
    stage.className = 'voice-stage';
    builder(stage);
    mountEl.appendChild(stage);
    return stage;
  }

  async function requestMicAccess(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      return { ok:false, reason:"This browser doesn't support microphone access at all (getUserMedia is unavailable here). Try a recent version of Chrome, Edge, or Safari." };
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      stream.getTracks().forEach(t=>{ try{ t.stop(); }catch(e){} });
      return { ok:true };
    }catch(err){
      return { ok:false, reason:"The microphone couldn't be reached. This is usually because the app itself doesn't have microphone permission at the operating-system level, or this page has already been blocked in the browser's own site settings. Check both, then try again." };
    }
  }

  function showMicError(reason){
    const mySession = ++sessionId;
    renderStage(stage=>{
      stage.innerHTML = `
        <div class="voice-error">
          <p class="voice-error-title">Microphone unavailable</p>
          <p class="voice-error-body">${escapeHtml(reason)}</p>
          <div class="voice-controls">
            <button type="button" class="action btn-check sans" data-role="retry">Try again</button>
            <button type="button" class="action btn-reset sans" data-role="exit">Back to List View</button>
          </div>
        </div>`;
      stage.querySelector('[data-role="retry"]').addEventListener('click', ()=>{ if(sessionId!==mySession) return; begin(); });
      stage.querySelector('[data-role="exit"]').addEventListener('click', ()=>{ if(sessionId!==mySession) return; onExit(); });
    });
  }

  async function begin(){
    idx = 0; score = 0; answered = 0;
    const mic = await requestMicAccess();
    if(!mic.ok){ showMicError(mic.reason); return; }
    runQuestion();
  }

  // Speaks a short line (feedback) and calls onDone once speech has finished.
  function speakText(text, onDone){
    if(!window.speechSynthesis){ onDone(); return; }
    const utter = new SpeechSynthesisUtterance(text);
    let done = false;
    const finish = ()=>{ if(done) return; done = true; onDone(); };
    utter.onend = finish;
    utter.onerror = finish;
    try{ window.speechSynthesis.cancel(); }catch(e){ /* ignore */ }
    try{ window.speechSynthesis.speak(utter); }catch(e){ finish(); }
  }

  // Speaks the question, and starts listening a fraction of a second before
  // the question finishes — right as its last word begins, where the browser
  // supports word-level boundary events — never earlier. Where boundary
  // events aren't supported, falls back to starting the moment speech ends.
  function speakQuestionThenListen(text, onListenStart){
    if(!window.speechSynthesis){ onListenStart(); return; }
    const utter = new SpeechSynthesisUtterance(text);
    let started = false;
    const words = text.trim().split(/\s+/).filter(Boolean);
    const lastWord = words[words.length-1] || '';
    const lastWordStart = lastWord ? text.lastIndexOf(lastWord) : -1;
    const trigger = ()=>{ if(started) return; started = true; onListenStart(); };
    utter.onboundary = (e)=>{
      if(started) return;
      if(typeof e.charIndex === 'number' && lastWordStart >= 0 && e.charIndex >= lastWordStart){ trigger(); }
    };
    utter.onend = trigger;   // fallback for voices/platforms with no boundary events
    utter.onerror = trigger;
    try{ window.speechSynthesis.cancel(); }catch(e){ /* ignore */ }
    try{ window.speechSynthesis.speak(utter); }catch(e){ trigger(); }
  }

  function runQuestion(){
    if(idx >= items.length){ showSummary(); return; }
    const mySession = ++sessionId;
    const item = items[idx];
    const stage = renderStage(stage=>{
      stage.innerHTML = `
        <div class="voice-progress sans">QUESTION ${idx+1} OF ${items.length}</div>
        <div class="voice-qtext">${item.display}</div>
        <div class="voice-status sans" data-role="status">Reading question…</div>
        <div class="voice-transcript sans" data-role="transcript"></div>
        <div class="voice-feedback sans" data-role="feedback"></div>
        <div class="voice-controls">
          <button type="button" class="action btn-reset sans" data-role="skip">Skip</button>
          <button type="button" class="action btn-reset sans" data-role="end">End round</button>
        </div>
        <div class="voice-score sans">Score so far: ${score} / ${answered}</div>
      `;
    });
    const statusEl = stage.querySelector('[data-role="status"]');
    const transcriptEl = stage.querySelector('[data-role="transcript"]');
    const feedbackEl = stage.querySelector('[data-role="feedback"]');

    stage.querySelector('[data-role="skip"]').addEventListener('click', ()=>{
      if(sessionId !== mySession) return;
      cleanup();
      idx++;
      runQuestion();
    });
    stage.querySelector('[data-role="end"]').addEventListener('click', ()=>{
      if(sessionId !== mySession) return;
      cleanup();
      showSummary();
    });

    speakQuestionThenListen(item.speak, ()=>{
      if(sessionId !== mySession) return;
      statusEl.textContent = 'Listening… speak your answer now';
      startListening(mySession, item, statusEl, transcriptEl, feedbackEl);
    });
  }

  function startListening(mySession, item, statusEl, transcriptEl, feedbackEl){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){
      statusEl.textContent = 'Speech recognition is not supported in this browser.';
      finalizeAnswer(mySession, null, item, statusEl, transcriptEl, feedbackEl);
      return;
    }
    let settled = false;
    const recognition = new SR();
    currentRecognition = recognition;
    recognition.lang = 'en-US';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    const settle = (transcript)=>{
      if(settled) return;
      settled = true;
      if(listenTimeoutId){ clearTimeout(listenTimeoutId); listenTimeoutId = null; }
      currentRecognition = null;
      finalizeAnswer(mySession, transcript, item, statusEl, transcriptEl, feedbackEl);
    };

    // Fixed 5-second window, timed from the moment listening begins.
    listenTimeoutId = setTimeout(()=>{
      if(settled) return;
      try{ recognition.stop(); }catch(e){ /* ignore */ }
      settle(null);
    }, 5000);

    recognition.onresult = (e)=>{
      const transcript = (e && e.results && e.results[0] && e.results[0][0]) ? e.results[0][0].transcript : '';
      settle(transcript);
    };
    recognition.onerror = ()=>{ settle(null); };
    recognition.onend = ()=>{ settle(null); }; // covers natural early end-of-speech with no result

    try{ recognition.start(); }
    catch(e){ settle(null); }
  }

  function finalizeAnswer(mySession, transcript, item, statusEl, transcriptEl, feedbackEl){
    if(sessionId !== mySession) return;
    answered++;
    const noAnswer = !transcript || !transcript.trim();
    const correct = !noAnswer && item.check(transcript);
    if(correct) score++;

    transcriptEl.textContent = noAnswer ? 'No answer heard.' : `You said: "${transcript.trim()}"`;
    statusEl.textContent = correct ? 'Correct!' : (noAnswer ? 'No answer — moving on' : 'Not quite');
    feedbackEl.classList.add('show', correct ? 'correct' : 'wrong');
    feedbackEl.innerHTML = correct ? 'Correct!' : `<span class="model">Answer: ${escapeHtml(item.correctDisplay)}</span>`;

    if(typeof onAnswer === 'function'){
      try{ onAnswer(idx, noAnswer ? '' : transcript.trim(), correct); }catch(e){ /* persistence hiccup shouldn't break the round */ }
    }

    const speakLine = correct ? 'Correct!' : `Answer: ${item.correctDisplay}`;
    speakText(speakLine, ()=>{
      setTimeout(()=>{
        if(sessionId !== mySession) return;
        idx++;
        runQuestion();
      }, 500);
    });
  }

  function showSummary(){
    const mySession = ++sessionId;
    renderStage(stage=>{
      stage.innerHTML = `
        <div class="voice-summary">
          <div class="voice-progress sans">ROUND COMPLETE</div>
          <div class="voice-score-big sans">${score} / ${answered} correct</div>
          <div class="voice-controls">
            <button type="button" class="action btn-check sans" data-role="redo">Redo round</button>
            <button type="button" class="action btn-reset sans" data-role="listview">Return to List View</button>
          </div>
        </div>`;
      stage.querySelector('[data-role="redo"]').addEventListener('click', ()=>{ if(sessionId!==mySession) return; begin(); });
      stage.querySelector('[data-role="listview"]').addEventListener('click', ()=>{ if(sessionId!==mySession) return; onExit(); });
    });
  }

  return { begin, cleanup };
}

function voiceIntroHTML(){
  return `<div class="voice-intro" id="voiceMount">
    <p>Questions are read aloud, one at a time — just answer out loud after each one. You'll be asked to allow microphone access when you start.</p>
    <button type="button" class="action btn-check sans" id="voiceStartBtn">Start Voice Round</button>
  </div>`;
}

function modeToggleHTML(mode){
  return `<div class="mode-toggle-row">
    <div class="mode-toggle">
      <button type="button" class="mode-btn ${mode==='list' ? 'active':''}" data-mode="list">List View</button>
      <button type="button" class="mode-btn ${mode==='voice' ? 'active':''}" data-mode="voice">Voice Round</button>
    </div>
  </div>`;
}

function wireModeToggle(cat, state, mode){
  document.querySelectorAll('.mode-toggle .mode-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const m = btn.dataset.mode;
      if(mode === m) return;
      teardownVoiceRound();
      state.mode = m;
      await saveState(cat, state);
      renderTab();
    });
  });
}

function startVoiceRoundFor(cat, state, items){
  const mountEl = document.getElementById('voiceMount');
  if(!mountEl) return;
  const controller = createVoiceRoundController({
    mountEl,
    items,
    onAnswer: (idx, transcript, correct)=>{
      state.answers = state.answers || {};
      state.results = state.results || {};
      state.answers[idx] = transcript;
      state.results[idx] = correct;
      saveState(cat, state);
    },
    onExit: async ()=>{
      teardownVoiceRound();
      state.mode = 'list';
      await saveState(cat, state);
      renderTab();
    }
  });
  activeVoiceTeardown = controller.cleanup;
  controller.begin();
}

// Any run of 3 or more underscores marks a blank, regardless of exact count,
// so questions using ____, _____, ______, etc. all normalize consistently.
const BLANK_RE = /_{3,}/g;

function fillblankVoiceItems(){
  return fillblank.map(q=>({
    display: q[0].replace(BLANK_RE, '<em>_____</em>'),
    speak: q[0].replace(BLANK_RE, 'blank'),
    correctDisplay: q[1][0],
    check: (transcript)=> voiceFuzzyMatch(transcript, q[1]),
  }));
}
function onewordVoiceItems(){
  return oneword.map(q=>({
    display: q[0],
    speak: q[0],
    correctDisplay: q[1][0],
    check: (transcript)=> voiceFuzzyMatch(transcript, q[1]),
  }));
}
function tfVoiceItems(){
  return tf.map(q=>({
    display: q[0],
    speak: q[0], // statement only — no "True, or false?" appended
    correctDisplay: q[1] ? 'True' : 'False',
    check: (transcript)=> voiceTFCheck(transcript, q[1]),
  }));
}

/* ============================= RENDER ============================= */
let currentTab = CATEGORIES[0].key;
const tabsEl = document.getElementById('tabs');
const mainEl = document.getElementById('main');
const stateCache = loadAllProgress();

function buildTabs(){
  tabsEl.innerHTML = '';
  CATEGORIES.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'tab-btn sans' + (c.key===currentTab ? ' active':'');
    b.textContent = c.icon + ' ' + c.label;
    b.onclick = async ()=>{ teardownVoiceRound(); currentTab = c.key; buildTabs(); renderTab(); };
    tabsEl.appendChild(b);
  });
}

async function renderTab(){
  teardownVoiceRound();
  mainEl.innerHTML = '<p class="empty-note">Loading…</p>';
  const cat = currentTab;
  const state = await loadState(cat);
  stateCache[cat] = state;

  const map = {
    fillblank: renderFillBlank,
    mcq: renderMCQ,
    oneword: renderOneWord,
    definitions: renderDefinitions,
    shortqa: renderShortQA,
    reasoning: renderReasoning,
    tf: renderTF,
    distinguish: renderDistinguish,
    labeling: renderLabeling,
  };
  map[cat](state);
}

function sectionHeader(title, desc){
  return `<div class="section-head"><h2>${title}</h2></div><p class="section-desc">${desc}</p>`;
}

function toolbarHTML(scoreText){
  return `<div class="toolbar">
    <button class="action btn-check sans" id="btnCheck">Check answers</button>
    <button class="action btn-reset sans" id="btnReset">Reset this section</button>
    ${scoreText ? `<span class="score-pill sans">${scoreText}</span>` : ''}
  </div>`;
}

function wireToolbar(onCheck, onReset){
  document.getElementById('btnCheck').onclick = onCheck;
  document.getElementById('btnReset').onclick = async ()=>{
    await clearState(currentTab);
    renderTab();
  };
}

/* ---------- Fill in the Blanks ---------- */
function renderFillBlank(state){
  const answers = state.answers || {};
  const results = state.results || {};
  const mode = state.mode || 'list';
  let html = sectionHeader('Fill in the Blanks', `${fillblank.length} sentences, lifted from every part of the chapter.`);
  html += modeToggleHTML(mode);
  if(mode === 'voice'){
    html += voiceIntroHTML();
    mainEl.innerHTML = html;
    wireModeToggle('fillblank', state, mode);
    document.getElementById('voiceStartBtn').addEventListener('click', ()=>{
      startVoiceRoundFor('fillblank', state, fillblankVoiceItems());
    });
    return;
  }

  html += toolbarHTML(scoreText(results, fillblank.length));
  fillblank.forEach((q,i)=>{
    const r = results[i];
    const cls = r===true ? ' correct' : (r===false ? ' wrong' : '');
    html += `<div class="qcard${cls}" id="q-${i}">
      <div class="qnum sans">SENTENCE ${i+1}</div>
      <div class="qtext">${q[0].replace(BLANK_RE, '<em>_____</em>')}</div>
      <input type="text" id="in-${i}" value="${answers[i] ? escapeHtml(answers[i]) : ''}" placeholder="Type the missing word…" />
      <div class="feedback sans ${r!==undefined ? 'show '+(r?'correct':'wrong') : ''}" id="fb-${i}">${feedbackHtml(r, q[1][0])}</div>
    </div>`;
  });
  mainEl.innerHTML = html;
  wireModeToggle('fillblank', state, mode);

  fillblank.forEach((q,i)=>{
    document.getElementById(`in-${i}`).addEventListener('input', (e)=>{
      answers[i] = e.target.value;
      state.answers = answers;
      saveState('fillblank', state);
    });
  });

  wireToolbar(()=>{
    fillblank.forEach((q,i)=>{
      const val = document.getElementById(`in-${i}`).value;
      const ok = matchesAny(val, q[1]);
      results[i] = ok;
      applyCardFeedback(i, ok, q[1][0]);
    });
    state.answers = answers;
    state.results = results;
    saveState('fillblank', state);
    renderScoreOnly(scoreText(results, fillblank.length));
  });
}

// Shared helpers for auto-graded, persistently-checked question sections.
function scoreText(results, total){
  const correct = Object.values(results||{}).filter(v=>v===true).length;
  return `${correct} / ${total}`;
}
function feedbackHtml(result, correctAnswerDisplay){
  if(result === undefined) return '';
  return result ? 'Correct.' : `Not quite. <span class="model">Answer: ${escapeHtml(correctAnswerDisplay)}</span>`;
}
function applyCardFeedback(i, ok, correctAnswerDisplay){
  const card = document.getElementById(`q-${i}`);
  const fb = document.getElementById(`fb-${i}`);
  if(!card || !fb) return;
  card.classList.remove('correct','wrong');
  card.classList.add(ok ? 'correct' : 'wrong');
  fb.classList.add('show', ok ? 'correct' : 'wrong');
  fb.innerHTML = ok ? 'Correct.' : `Not quite. <span class="model">Answer: ${escapeHtml(correctAnswerDisplay)}</span>`;
}

function renderScoreOnly(text){
  const pill = document.querySelector('.score-pill');
  if(pill) pill.textContent = text;
  else {
    const tb = document.querySelector('.toolbar');
    if(tb){ const s=document.createElement('span'); s.className='score-pill sans'; s.textContent=text; tb.appendChild(s); }
  }
}

/* ---------- MCQ ---------- */
function renderMCQ(state){
  const answers = state.answers || {};
  let html = sectionHeader('Multiple Choice', 'One correct option each.');
  html += toolbarHTML(state.checked ? `${state.score} / ${mcq.length}` : '');
  mcq.forEach((q,i)=>{
    html += `<div class="qcard" id="q-${i}">
      <div class="qnum sans">QUESTION ${i+1}</div>
      <div class="qtext">${q[0]}</div>
      <div class="options sans" id="opts-${i}">
        ${q[1].map((opt,oi)=>`
          <label class="opt ${answers[i]===oi ? 'selected':''}" data-oi="${oi}">
            <input type="radio" name="mcq-${i}" value="${oi}" ${answers[i]===oi?'checked':''}/>
            ${opt}
          </label>`).join('')}
      </div>
      <div class="feedback sans" id="fb-${i}"></div>
    </div>`;
  });
  mainEl.innerHTML = html;

  mcq.forEach((q,i)=>{
    document.querySelectorAll(`#opts-${i} .opt`).forEach(optEl=>{
      optEl.addEventListener('click', ()=>{
        const oi = parseInt(optEl.dataset.oi);
        answers[i] = oi;
        state.answers = answers;
        state.checked = false;
        saveState('mcq', state);
        document.querySelectorAll(`#opts-${i} .opt`).forEach(o=>o.classList.remove('selected'));
        optEl.classList.add('selected');
        optEl.querySelector('input').checked = true;
      });
    });
  });

  function gradeMCQ(){
    let score = 0;
    mcq.forEach((q,i)=>{
      const ok = answers[i] === q[2];
      if(ok) score++;
      applyCardFeedback(i, ok, q[1][q[2]]);
    });
    state.checked = true;
    state.score = score;
    saveState('mcq', state);
    renderScoreOnly(`${score} / ${mcq.length}`);
  }

  wireToolbar(gradeMCQ);

  // Restore a previously-checked state immediately on load, no click needed.
  if(state.checked){ gradeMCQ(); }
}

/* ---------- Definitions / Short Answer / Reasoning (shared self-check pattern) ---------- */
function renderSelfCheckSection(cat, title, desc, list, state, labelFn){
  const answers = state.answers || {};
  const revealed = state.revealed || {};
  let html = sectionHeader(title, desc);
  html += toolbarHTML();
  list.forEach((q,i)=>{
    html += `<div class="qcard" id="q-${i}">
      <div class="qnum sans">${labelFn(i)}</div>
      <div class="qtext">${q[0]}</div>
      <textarea id="in-${i}" placeholder="Your answer…">${answers[i] ? escapeHtml(answers[i]) : ''}</textarea>
      <div class="toolbar" style="margin-top:8px;margin-bottom:0;">
        <button class="action btn-check sans" style="padding:6px 12px;font-size:12px;" id="rev-${i}">Reveal model answer</button>
      </div>
      <div class="feedback sans ${revealed[i] ? 'show correct':''}" id="fb-${i}">${revealed[i] ? `<span class="model">${q[1]}</span>` : ''}</div>
    </div>`;
  });
  mainEl.innerHTML = html;
  document.getElementById('btnCheck').style.display='none';

  list.forEach((q,i)=>{
    document.getElementById(`in-${i}`).addEventListener('input', (e)=>{
      answers[i] = e.target.value;
      state.answers = answers;
      saveState(cat, state);
    });
    document.getElementById(`rev-${i}`).addEventListener('click', ()=>{
      revealed[i] = true;
      state.revealed = revealed;
      saveState(cat, state);
      const fb = document.getElementById(`fb-${i}`);
      fb.classList.add('show','correct');
      fb.innerHTML = `<span class="model">${q[1]}</span>`;
    });
  });

  document.getElementById('btnReset').onclick = ()=>{
    clearState(cat);
    renderTab();
  };
}

function renderDefinitions(state){
  renderSelfCheckSection('definitions', 'Definitions', 'Write the definition in your own words, then reveal the model answer to compare.', definitions, state, ()=>'DEFINE');
}

function renderShortQA(state){
  renderSelfCheckSection('shortqa', 'Short Answer Questions', 'Write a short answer, then reveal the model answer to compare.', shortqa, state, (i)=>`QUESTION ${i+1}`);
}

function renderReasoning(state){
  renderSelfCheckSection('reasoning', 'Reasoning', `${reasoning.length} questions that connect facts from different parts of the chapter — write your reasoning, then compare with the model answer.`, reasoning, state, (i)=>`REASONING ${i+1}`);
}

/* ---------- True/False ---------- */
function renderTF(state){
  const answers = state.answers || {};
  const results = state.results || {};
  const mode = state.mode || 'list';
  let html = sectionHeader('True or False', 'Decide whether each statement is true or false.');
  html += modeToggleHTML(mode);
  if(mode === 'voice'){
    html += voiceIntroHTML();
    mainEl.innerHTML = html;
    wireModeToggle('tf', state, mode);
    document.getElementById('voiceStartBtn').addEventListener('click', ()=>{
      startVoiceRoundFor('tf', state, tfVoiceItems());
    });
    return;
  }

  html += toolbarHTML(scoreText(results, tf.length));
  tf.forEach((q,i)=>{
    const r = results[i];
    const cls = r===true ? ' correct' : (r===false ? ' wrong' : '');
    html += `<div class="qcard${cls}" id="q-${i}">
      <div class="qnum sans">STATEMENT ${i+1}</div>
      <div class="qtext">${q[0]}</div>
      <div class="tf-row sans">
        <div class="tf-btn ${answers[i]===true?'selected':''}" data-v="true" id="t-${i}">True</div>
        <div class="tf-btn ${answers[i]===false?'selected':''}" data-v="false" id="f-${i}">False</div>
      </div>
      <div class="feedback sans ${r!==undefined ? 'show '+(r?'correct':'wrong') : ''}" id="fb-${i}">${feedbackHtml(r, q[1] ? 'True' : 'False')}</div>
    </div>`;
  });
  mainEl.innerHTML = html;
  wireModeToggle('tf', state, mode);

  tf.forEach((q,i)=>{
    document.getElementById(`t-${i}`).addEventListener('click', ()=>{
      answers[i] = true; state.answers = answers;
      saveState('tf', state);
      document.getElementById(`t-${i}`).classList.add('selected');
      document.getElementById(`f-${i}`).classList.remove('selected');
    });
    document.getElementById(`f-${i}`).addEventListener('click', ()=>{
      answers[i] = false; state.answers = answers;
      saveState('tf', state);
      document.getElementById(`f-${i}`).classList.add('selected');
      document.getElementById(`t-${i}`).classList.remove('selected');
    });
  });

  wireToolbar(()=>{
    tf.forEach((q,i)=>{
      const ok = answers[i] === q[1];
      results[i] = ok;
      applyCardFeedback(i, ok, q[1] ? 'True' : 'False');
    });
    state.answers = answers;
    state.results = results;
    saveState('tf', state);
    renderScoreOnly(scoreText(results, tf.length));
  });
}

/* ---------- Distinguish ---------- */
function renderDistinguish(state){
  const answers = state.answers || {};
  let html = sectionHeader('Distinguish Between', 'Fill in the right-hand differences — the left side is given as a guide.');
  html += toolbarHTML();
  distinguish.forEach((d,di)=>{
    html += `<div class="qcard">
      <div class="qnum sans">${d.title.toUpperCase()}</div>
      <table class="distinguish-table">
        <tr><th>Basis</th><th>${d.left}</th><th>${d.right}</th></tr>
        ${d.rows.map((r,ri)=>{
          const key = `${di}-${ri}`;
          const val = answers[key] || '';
          return `<tr>
            <td>${r[0]}</td>
            <td>${r[1]}</td>
            <td><input type="text" id="d-${key}" value="${escapeHtml(val)}" placeholder="Your answer…"/></td>
          </tr>`;
        }).join('')}
      </table>
      <div class="feedback sans" id="rev-${di}" style="margin-top:10px;"></div>
      <div class="toolbar" style="margin-top:8px;margin-bottom:0;">
        <button class="action btn-check sans" style="padding:6px 12px;font-size:12px;" id="btn-rev-${di}">Reveal model answers</button>
      </div>
    </div>`;
  });
  mainEl.innerHTML = html;
  document.getElementById('btnCheck').style.display='none';

  distinguish.forEach((d,di)=>{
    d.rows.forEach((r,ri)=>{
      const key = `${di}-${ri}`;
      document.getElementById(`d-${key}`).addEventListener('input', (e)=>{
        answers[key] = e.target.value;
        state.answers = answers;
        saveState('distinguish', state);
      });
    });
    document.getElementById(`btn-rev-${di}`).addEventListener('click', ()=>{
      const fb = document.getElementById(`rev-${di}`);
      fb.classList.add('show','correct');
      fb.innerHTML = d.rows.map(r=>`<span class="model">${r[0]}: ${r[2]}</span>`).join('');
    });
  });

  document.getElementById('btnReset').onclick = ()=>{
    clearState('distinguish');
    renderTab();
  };
}

/* ---------- Labeling ---------- */
function renderLabeling(state){
  const answers = state.answers || {};
  let html = sectionHeader('Label the Diagram', 'Match each numbered marker to the correct part.');
  html += toolbarHTML(state.checked ? `${state.score} / ${labeling.reduce((a,d)=>a+d.points.length,0)}` : '');

  labeling.forEach((d,di)=>{
    html += `<div class="qcard" id="diag-${di}">
      <div class="qnum sans">${d.title.toUpperCase()}</div>
      <div class="diagram-wrap">
        ${d.svg}
        <div class="label-list">
          ${d.points.map((p,pi)=>{
            const key = `${di}-${pi}`;
            const val = answers[key] || '';
            return `<div class="label-row">
              <div class="marker">${p.n}</div>
              <select id="sel-${key}" data-key="${key}">
                <option value="">Choose…</option>
                ${d.optionPool.map(opt=>`<option value="${escapeHtml(opt)}" ${val===opt?'selected':''}>${opt}</option>`).join('')}
              </select>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="feedback sans" id="fb-${di}"></div>
    </div>`;
  });
  mainEl.innerHTML = html;

  labeling.forEach((d,di)=>{
    d.points.forEach((p,pi)=>{
      const key = `${di}-${pi}`;
      document.getElementById(`sel-${key}`).addEventListener('change', (e)=>{
        answers[key] = e.target.value;
        state.answers = answers;
        state.checked = false;
        saveState('labeling', state);
      });
    });
  });

  function gradeLabeling(){
    let score = 0, total = 0;
    labeling.forEach((d,di)=>{
      let diagOk = true;
      d.points.forEach((p,pi)=>{
        total++;
        const key = `${di}-${pi}`;
        const val = answers[key] || '';
        const ok = norm(val) === norm(p.label);
        if(ok) score++; else diagOk = false;
      });
      const card = document.getElementById(`diag-${di}`);
      const fb = document.getElementById(`fb-${di}`);
      card.classList.remove('correct','wrong');
      card.classList.add(diagOk?'correct':'wrong');
      fb.classList.add('show', diagOk?'correct':'wrong');
      fb.innerHTML = diagOk ? 'All correct.' : `<span class="model">Correct labels: ${d.points.map(p=>p.n+'. '+p.label).join(' · ')}</span>`;
    });
    state.checked = true;
    state.score = score;
    saveState('labeling', state);
    renderScoreOnly(`${score} / ${total}`);
  }

  wireToolbar(gradeLabeling);

  if(state.checked){ gradeLabeling(); }
}

/* ---------- utils ---------- */
function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

  btnResetAllEl.addEventListener('click', ()=>{

    if(!ok) return;
    teardownVoiceRound();
    resetAllProgress();
    renderTab();
  });
}

renderTab();
