<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Sound &amp; Noise — Quiz Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f2027;
    --bg2:#15323b;
    --panel:#173a44;
    --panel2:#1c4550;
    --line:#2b5b66;
    --cream:#f6efdf;
    --muted:#a9c4cb;
    --amber:#f2a93b;
    --amber-dim:#8a6a2c;
    --coral:#ff6b4a;
    --good:#6fcf97;
    --bad:#ef6f6c;
    --wave: 0 0 0 3px rgba(242,169,59,.18);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, #1d4b56 0%, transparent 45%),
      radial-gradient(circle at 100% 20%, #123039 0%, transparent 40%),
      linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
    color:var(--cream);
    font-family:'Nunito Sans', sans-serif;
    min-height:100vh;
    padding-bottom:56px;
  }
  h1,h2,h3,.display{font-family:'Baloo 2', sans-serif;}
  ::selection{background:var(--amber);color:#1a1a1a;}

  /* ---- Header ---- */
  header.top{
    padding:20px 16px 14px;
    position:relative;
    overflow:hidden;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(242,169,59,.08), transparent 70%);
  }
  .wave-deco{
    position:absolute; inset:auto 0 -6px 0; height:34px; opacity:.35; pointer-events:none;
  }
  header.top h1{
    font-size:1.5rem; margin:0 0 2px; font-weight:800; letter-spacing:.2px;
    display:flex; align-items:center; gap:10px;
  }
  header.top h1 .sw{
    display:inline-block; width:26px; height:26px; flex:none;
  }
  header.top p{margin:0; color:var(--muted); font-size:.87rem; line-height:1.4; max-width:46ch;}

  /* ---- Tabs ---- */
  nav.tabs{
    display:flex; gap:8px; overflow-x:auto; padding:12px 12px 4px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    padding:9px 12px; border-radius:12px; font-size:.72rem; font-weight:700;
    cursor:pointer; min-width:74px; transition:transform .15s ease, background .2s, color .2s, border-color .2s;
  }
  .tab-btn .ic{font-size:1.2rem; line-height:1;}
  .tab-btn.active{
    background:linear-gradient(160deg, var(--amber), #d98a26);
    color:#20140a; border-color:transparent; transform:translateY(-1px);
    box-shadow:0 4px 14px rgba(242,169,59,.28);
  }
  .tab-btn .count{font-weight:600; opacity:.85; font-size:.65rem;}

  main{padding:14px 14px 40px; max-width:640px; margin:0 auto;}

  /* ---- Category header / progress ---- */
  .cat-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin:6px 2px 14px;
  }
  .cat-head h2{margin:0; font-size:1.15rem; font-weight:700;}
  .cat-head .sub{color:var(--muted); font-size:.78rem; margin-top:2px;}
  .progress-pill{
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:6px 12px; font-size:.72rem; font-weight:700; color:var(--amber); white-space:nowrap;
  }

  .toolbar{
    display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;
  }
  button.action{
    font-family:'Nunito Sans', sans-serif; font-weight:800; font-size:.82rem;
    border:none; border-radius:11px; padding:11px 16px; cursor:pointer;
    transition:transform .12s ease, filter .15s ease;
  }
  button.action:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(160deg, var(--amber), #d98a26); color:#20140a;}
  .btn-ghost{background:transparent; color:var(--coral); border:1.5px solid rgba(255,107,74,.55);}
  .btn-ghost:hover{background:rgba(255,107,74,.08);}
  .btn-mini{background:var(--panel2); color:var(--cream); border:1px solid var(--line); font-size:.72rem; padding:8px 12px;}

  /* ---- Question cards ---- */
  .qcard{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 14px 15px; margin-bottom:12px; position:relative;
  }
  .qnum{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:7px; background:var(--panel2);
    color:var(--amber); font-weight:800; font-size:.72rem; margin-right:8px; flex:none;
  }
  .qtext{font-size:.94rem; line-height:1.45; font-weight:600; color:var(--cream);}
  .qtext .blank-txt{color:var(--amber); font-weight:800;}
  .qrow{display:flex; align-items:flex-start; margin-bottom:9px;}

  input[type=text], textarea{
    width:100%; background:var(--bg); border:1.5px solid var(--line); color:var(--cream);
    border-radius:9px; padding:9px 11px; font-size:.9rem; font-family:inherit;
    margin-top:6px; outline:none;
  }
  textarea{min-height:56px; resize:vertical;}
  input[type=text]:focus, textarea:focus{border-color:var(--amber); box-shadow:var(--wave);}
  input[type=text].correct, textarea.correct{border-color:var(--good); background:rgba(111,207,151,.08);}
  input[type=text].wrong, textarea.wrong{border-color:var(--bad); background:rgba(239,111,108,.08);}

  .opts{display:flex; flex-direction:column; gap:7px; margin-top:8px;}
  .opt{
    display:flex; align-items:center; gap:9px; background:var(--bg);
    border:1.5px solid var(--line); border-radius:9px; padding:9px 11px;
    font-size:.87rem; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .opt:active{transform:scale(.99);}
  .opt input{accent-color:var(--amber);}
  .opt.chosen{border-color:var(--amber); background:rgba(242,169,59,.09);}
  .opt.reveal-correct{border-color:var(--good); background:rgba(111,207,151,.12);}
  .opt.reveal-wrong{border-color:var(--bad); background:rgba(239,111,108,.12);}

  .tf-row{display:flex; gap:8px; margin-top:8px;}
  .tf-btn{
    flex:1; text-align:center; padding:10px; border-radius:9px; font-weight:800; font-size:.85rem;
    background:var(--bg); border:1.5px solid var(--line); cursor:pointer; color:var(--muted);
  }
  .tf-btn.chosen{border-color:var(--amber); color:var(--amber); background:rgba(242,169,59,.09);}
  .tf-btn.reveal-correct{border-color:var(--good); color:var(--good); background:rgba(111,207,151,.12);}
  .tf-btn.reveal-wrong{border-color:var(--bad); color:var(--bad); background:rgba(239,111,108,.12);}

  .feedback{
    margin-top:8px; font-size:.78rem; font-weight:700; display:none; padding:8px 10px;
    border-radius:8px; line-height:1.4;
  }
  .feedback.show{display:block;}
  .feedback.good{color:var(--good); background:rgba(111,207,151,.1);}
  .feedback.bad{color:var(--bad); background:rgba(239,111,108,.1);}
  .feedback b{font-weight:800;}

  /* definitions / short-answer flip style */
  .reveal-box{
    margin-top:9px; background:var(--bg); border:1px dashed var(--line); border-radius:9px;
    padding:10px 11px; font-size:.85rem; color:var(--muted); display:none; line-height:1.45;
  }
  .reveal-box.show{display:block; color:var(--cream);}
  .selfmark{display:flex; gap:8px; margin-top:9px;}
  .sm-btn{
    flex:1; padding:8px; border-radius:8px; font-size:.76rem; font-weight:800; cursor:pointer;
    border:1.5px solid var(--line); background:var(--bg); color:var(--muted);
  }
  .sm-btn.got.active{border-color:var(--good); color:var(--good); background:rgba(111,207,151,.1);}
  .sm-btn.retry.active{border-color:var(--coral); color:var(--coral); background:rgba(255,107,74,.1);}

  /* distinguish table */
  .dist-title{font-weight:800; font-size:.98rem; color:var(--amber); margin-bottom:2px;}
  .dist-cols{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;}
  .dist-cols label{font-size:.68rem; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:800;}
  .dist-answer{
    margin-top:9px; background:var(--bg); border-radius:9px; padding:8px 10px; display:none;
    border:1px dashed var(--line);
  }
  .dist-answer.show{display:block;}
  .dist-answer table{width:100%; border-collapse:collapse; font-size:.8rem;}
  .dist-answer td{padding:5px 4px; vertical-align:top; border-bottom:1px solid var(--line);}
  .dist-answer td:first-child{color:var(--amber); font-weight:700; width:50%;}

  /* labeling diagrams */
  .diagram-wrap{background:var(--bg); border-radius:12px; padding:10px; border:1px solid var(--line);}
  .diagram-wrap svg{width:100%; height:auto; display:block;}
  .label-list{margin-top:12px; display:flex; flex-direction:column; gap:8px;}
  .label-row{display:flex; align-items:center; gap:8px; background:var(--bg); border:1.5px solid var(--line); border-radius:9px; padding:8px 10px;}
  .label-row .marker{
    width:24px; height:24px; border-radius:50%; background:var(--amber); color:#20140a;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.75rem; flex:none;
  }
  select{
    flex:1; background:var(--panel2); color:var(--cream); border:1px solid var(--line);
    border-radius:8px; padding:8px 9px; font-size:.83rem; font-family:inherit; outline:none;
  }
  select.correct{border-color:var(--good);}
  select.wrong{border-color:var(--bad);}

  .empty-hint{color:var(--muted); font-size:.8rem; text-align:center; padding:30px 10px;}

  .footer-note{
    text-align:center; color:var(--muted); font-size:.7rem; padding:18px 24px 4px; line-height:1.5;
  }
  .footer-note b{color:var(--amber);}

  /* ---- global actions row ---- */
  .global-actions{
    display:flex; justify-content:flex-end; padding:2px 14px 0; max-width:640px; margin:0 auto;
  }
  .global-actions button{font-size:.7rem; padding:7px 12px;}

  /* ---- List View / Voice Round mode toggle ---- */
  .mode-toggle{
    display:flex; width:100%; gap:8px; margin-bottom:14px;
  }
  .mode-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--panel2); border:1.5px solid var(--line); color:var(--muted);
    padding:11px 10px; border-radius:11px; font-weight:800; font-size:.82rem; cursor:pointer;
    font-family:'Nunito Sans', sans-serif; transition:border-color .15s, color .15s, background .15s;
  }
  .mode-btn.active{
    border-color:var(--amber); color:var(--amber); background:rgba(242,169,59,.1);
  }

  /* ---- Voice Round stage ---- */
  .voice-card{ text-align:center; padding:22px 16px 20px; }
  .voice-phase-label{
    font-size:.68rem; letter-spacing:.6px; text-transform:uppercase; font-weight:800;
    color:var(--amber); margin-bottom:10px;
  }
  .voice-qtext{font-size:1.05rem; font-weight:700; line-height:1.5; margin-bottom:14px;}
  .voice-orb{
    width:64px; height:64px; border-radius:50%; margin:6px auto 14px; position:relative;
    background:radial-gradient(circle, rgba(242,169,59,.25), transparent 70%);
    display:flex; align-items:center; justify-content:center; font-size:1.7rem;
  }
  .voice-orb.listening{ animation:pulseOrb 1.1s ease-in-out infinite; }
  @keyframes pulseOrb{
    0%,100%{ box-shadow:0 0 0 0 rgba(242,169,59,.35); }
    50%{ box-shadow:0 0 0 14px rgba(242,169,59,0); }
  }
  .voice-transcript{
    font-size:.82rem; color:var(--muted); min-height:18px; margin-bottom:6px; font-style:italic;
  }
  .voice-result{
    font-size:.9rem; font-weight:800; margin:10px 0 4px;
  }
  .voice-result.good{color:var(--good);}
  .voice-result.bad{color:var(--bad);}
  .voice-progress{
    font-size:.72rem; color:var(--muted); margin-bottom:14px;
  }
  .voice-controls{ display:flex; gap:8px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .mic-explain-list{ text-align:left; color:var(--muted); font-size:.82rem; line-height:1.55; margin:10px 0 4px; }
  .mic-explain-list li{ margin-bottom:6px; }
  .voice-summary-score{ font-size:2rem; font-weight:800; color:var(--amber); margin:6px 0 2px; }

  @media (min-width:520px){
    header.top h1{font-size:1.7rem;}
    .dist-cols{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<header class="top">
  <h1><svg class="sw" viewBox="0 0 24 24" fill="none"><path d="M3 10v4h3l4 4V6l-4 4H3z" fill="#f2a93b"/><path d="M14.5 8.5a5 5 0 0 1 0 7" stroke="#f2a93b" stroke-width="1.6" stroke-linecap="round"/><path d="M17.2 6a8.5 8.5 0 0 1 0 12" stroke="#ff6b4a" stroke-width="1.6" stroke-linecap="round"/></svg>Sound &amp; Noise Quiz Lab</h1>
  <p>Every activity, fact and diagram from Chapter 8 — turned into practice questions. Pick a category below and start testing yourself.</p>
</header>

<nav class="tabs" id="tabs"></nav>

<div class="global-actions">
  <button class="action btn-ghost" id="resetAllBtn">Reset all answers</button>
</div>

<main id="main">
  <div class="cat-head">
    <div>
      <h2 id="catTitle">—</h2>
      <div class="sub" id="catSub">—</div>
    </div>
    <div class="progress-pill" id="catProgress">0/0</div>
  </div>
  <div id="modeToggleRow"></div>
  <div class="toolbar" id="toolbarRow">
    <button class="action btn-primary" id="checkBtn">Check answers</button>
    <button class="action btn-ghost" id="resetBtn">Reset this category</button>
  </div>
  <div id="qList"></div>
</main>

<div class="footer-note">Your answers &amp; scores are saved automatically on this device. Tap <b>Reset this category</b> to clear just that section.</div>

<script>
/* =========================================================
   DATA — every category built from the chapter's sentences
   ========================================================= */

const FIB = [
 {t:"Sound is the sensation of ___.", a:["hearing"]},
 {t:"Sound is produced when something ___.", a:["vibrates"]},
 {t:"A vibrating string produces ___.", a:["sound"]},
 {t:"When we speak, our ___ vibrates and sound is produced.", a:["tongue"]},
 {t:"A clock produces ___ (tick tick).", a:["sound"]},
 {t:"The chirping of birds, rattling of leaves and thunder are ___ sounds.", a:["natural"]},
 {t:"The ringing of a door bell, blowing of horns and sounds produced by machines are all ___ sounds.", a:["artificial"]},
 {t:"Sound is produced by the ___ in a body.", a:["vibrations"]},
 {t:"Vibrations are fast '___' movements of a body.", a:["to and fro","to-and-fro"]},
 {t:"These ___ in a body produce sound.", a:["vibrations"]},
 {t:"When you strike a spoon on a metal utensil and touch its edges, you can feel the ___.", a:["vibration","vibrations"]},
 {t:"Different materials produce different kind of ___ (steel, glass and aluminium tumbler activity).", a:["sounds","sound"]},
 {t:"The distance between two adjacent crests or troughs is called ___.", a:["wavelength"]},
 {t:"The height of the crest or depth of the trough is known as ___.", a:["amplitude"]},
 {t:"The number of oscillations produced per second is called the ___.", a:["frequency"]},
 {t:"The highest point on a wave is called the ___.", a:["crest"]},
 {t:"The lowest point on a wave is called the ___.", a:["trough"]},
 {t:"Sound travels in a ___.", a:["wave"]},
 {t:"Plants produce sound by ___ of their leaves when air blows.", a:["rattling"]},
 {t:"Plants also produce sound when twigs, branches and ___ fall down from the leaves.", a:["fruits"]},
 {t:"Most animals have ___ cords and produce sound by means of them.", a:["vocal"]},
 {t:"Bees produce the sound '___'.", a:["buzz"]},
 {t:"Birds produce the sound '___'.", a:["chirp"]},
 {t:"Snakes produce the sound '___'.", a:["hiss"]},
 {t:"Cows produce the sound '___'.", a:["moo"]},
 {t:"Birds chirp with the help of the ___, a ring of cartilage in their wind pipe.", a:["syrinx"]},
 {t:"Most insects produce sound by ___ their wings.", a:["flapping"]},
 {t:"In human beings, the voice box has a pair of membranes called ___.", a:["vocal cords"]},
 {t:"Vocal cords vibrate and produce sound with air passing through the ___.", a:["larynx"]},
 {t:"The muscles around the vocal cords may stretch or ___ the membranes, producing different types of sound.", a:["loosen"]},
 {t:"Sounds which are pleasant to our ears are known as ___ sounds.", a:["pleasant"]},
 {t:"Pleasant sounds are more ___.", a:["rhythmic"]},
 {t:"Sounds which are not pleasant to our ears are known as ___ sounds.", a:["unpleasant"]},
 {t:"Unpleasant sounds are not ___.", a:["rhythmic"]},
 {t:"Musical sounds are pleasant to hear and ___ our mind and body.", a:["refresh"]},
 {t:"Machines produce unpleasant sound, which can cause headache and ___.", a:["nausea"]},
 {t:"___ is an example of soft sound.", a:["whispering"]},
 {t:"Rockets produce ___ sound.", a:["loud"]},
 {t:"DJs produce ___ sound.", a:["loud"]},
 {t:"Very loud sounds can ___ our ears.", a:["damage"]},
 {t:"Certain particular sounds used as a signal to inform about an event, disaster or a warning sign are known as ___ sounds.", a:["warning"]},
 {t:"The fire alarm is made by ___.", a:["fire brigades","fire brigade"]},
 {t:"The ambulance siren is made by an ambulance in case of ___.", a:["emergency"]},
 {t:"The tornado warning siren warns people about an incoming ___.", a:["tornado"]},
 {t:"Sound which is loud and unpleasant is called ___.", a:["noise"]},
 {t:"Noise produces strong vibrations which can cause damage to our ___.", a:["ear drums","eardrums"]},
 {t:"Very loud sounds sometimes cause permanent ___.", a:["deafness"]},
 {t:"Sources of noise pollution include automobiles and their ___.", a:["horns"]},
 {t:"We should not play the television, radio or music player at ___ volumes.", a:["loud"]},
 {t:"We should try to blow horns only when ___.", a:["necessary"]},
 {t:"DJ should be used only for a ___ period of time.", a:["limited"]},
 {t:"Noise from machines can be reduced by the use of ___.", a:["silencers"]},
 {t:"Growing more ___ along the road side also reduces noise pollution.", a:["trees"]},
 {t:"Sound from thicker guitar wires is of ___ pitch.", a:["low"]},
 {t:"Sound from thinner guitar wires is of ___ pitch.", a:["high"]},
 {t:"Frequency is more when wires are thin and ___ fixed.", a:["tightly"]},
 {t:"Frequency is less when wires are thick and ___ fixed.", a:["loosely"]},
 {t:"Living things and non-living things both produce ___.", a:["sound"]},
];

const MCQ = [
 {t:"What is sound?", o:["A sensation of hearing","A sensation of seeing","A type of light","A form of heat"], c:0},
 {t:"Sound is produced when something:", o:["melts","vibrates","evaporates","freezes"], c:1},
 {t:"Which of these is a natural sound?", o:["Door bell","Horn","Thunder","Machine sound"], c:2},
 {t:"Which of these is an artificial sound?", o:["Chirping of birds","Rattling of leaves","Thunder","Ringing of a door bell"], c:3},
 {t:"A fast 'to and fro' movement of a body is called:", o:["Rotation","Vibration","Reflection","Refraction"], c:1},
 {t:"The distance between two adjacent crests is called:", o:["Amplitude","Frequency","Wavelength","Pitch"], c:2},
 {t:"The height of the crest is called:", o:["Wavelength","Amplitude","Frequency","Trough"], c:1},
 {t:"The number of oscillations produced per second is called:", o:["Amplitude","Wavelength","Frequency","Crest"], c:2},
 {t:"Which part helps birds to chirp?", o:["Larynx","Syrinx","Vocal cords","Trachea"], c:1},
 {t:"Most insects produce sound by:", o:["Using vocal cords","Flapping their wings","Rattling their legs","Hissing"], c:1},
 {t:"In human beings, sound is produced mainly by the vibration of:", o:["The tongue only","Vocal cords","Lungs","Eardrum"], c:1},
 {t:"Vocal cords are located inside the:", o:["Larynx","Heart","Stomach","Lungs"], c:0},
 {t:"Musical sounds are generally:", o:["Unpleasant","Pleasant","Noise","Silent"], c:1},
 {t:"Sound which is loud and unpleasant is called:", o:["Music","Noise","Echo","Pitch"], c:1},
 {t:"Which of these is a warning sound?", o:["Fire alarm","Music","Chirping","Buzzing"], c:0},
 {t:"Which of the following causes noise pollution?", o:["A singing bird","A vacuum cleaner","A whisper","A ticking clock"], c:1},
 {t:"Very loud sound can permanently cause:", o:["Blindness","Deafness","Baldness","Fever"], c:1},
 {t:"Which of these helps reduce noise pollution?", o:["Bursting crackers","Growing more trees","Using loud speakers","Blowing horns unnecessarily"], c:1},
 {t:"A guitar wire that is thin and tightly fixed produces a sound of:", o:["Low pitch","High pitch","No pitch","No sound"], c:1},
 {t:"Which animal makes a hissing sound?", o:["Cow","Snake","Bee","Bird"], c:1},
 {t:"Which of these is an example of soft sound?", o:["Rocket launch","Whispering","DJ music","Thunder"], c:1},
 {t:"Sound cannot be produced without:", o:["Light","Vibration","Heat","Colour"], c:1},
 {t:"The lowest point on a sound wave is called the:", o:["Crest","Trough","Amplitude","Wavelength"], c:1},
 {t:"Silencers are used to reduce noise from:", o:["Trees","Machines","Whispering","Birds"], c:1},
 {t:"An ambulance siren is used to:", o:["Entertain people","Warn during an emergency","Play music","Test speakers"], c:1},
 {t:"Cows produce sound known as:", o:["Buzz","Hiss","Moo","Chirp"], c:2},
 {t:"Human vocal cords vibrate with the help of air passing through the:", o:["Larynx","Stomach","Nose","Ear"], c:0},

const ONEWORD = [
 {t:"The sensation of hearing.", a:["sound"]},
 {t:"A fast to-and-fro movement of a body.", a:["vibration","vibrations"]},
 {t:"The ring of cartilage in a bird's windpipe that helps it chirp.", a:["syrinx"]},
 {t:"The pair of membranes present in the human voice box.", a:["vocal cords"]},
 {t:"The tube through which air passes to vibrate the vocal cords.", a:["larynx"]},
 {t:"A loud, unpleasant sound.", a:["noise"]},
 {t:"The sound made by bees.", a:["buzz"]},
 {t:"The sound made by snakes.", a:["hiss"]},
 {t:"The sound made by cows.", a:["moo"]},
 {t:"The sound made by birds.", a:["chirp"]},
 {t:"The highest point of a sound wave.", a:["crest"]},
 {t:"The lowest point of a sound wave.", a:["trough"]},
 {t:"A device fitted on machines to reduce their noise.", a:["silencer","silencers"]},
 {t:"A musical instrument whose wires of different thickness give different pitch.", a:["guitar"]},
 {t:"The device that warns about an incoming tornado.", a:["siren","tornado warning siren"]},
];

const DEFS = [
 {t:"Sound", d:"Sound is the sensation of hearing. It is produced when something vibrates."},

/* Categories that support Voice Round (hands-free) mode alongside List View */
const VOICE_CAPABLE = ["fib","oneword","tf"];

/* =========================================================
   PERSISTENCE
   Uses localStorage so answers survive switching sections,
   closing the tab/app, and reopening this file later.
   Falls back to an in-memory object if storage is blocked
   (e.g. private browsing), so the quiz still works within
   the current session even then.
   ========================================================= */
const STORE_KEY = "quiz-progress-sound-and-noise";
let STATE = {}; // { fib:{answers:{}, checked:false}, mcq:{...}, ... }
let storageAvailable = true;
let modeByCategory = {}; // { fib:"list"|"voice", oneword:..., tf:... } — not persisted, defaults to "list"

function defaultCatState(){ return {answers:{}, checked:false}; }

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) STATE = JSON.parse(raw);
  }catch(e){
    storageAvailable = false; // e.g. storage disabled/blocked — still works in-memory this session
  }
  CATS.forEach(c=>{ if(!STATE[c.id]) STATE[c.id] = defaultCatState(); });
}

function saveState(){
  if(!storageAvailable) return;
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(STATE));
  }catch(e){
    storageAvailable = false;
  }
}

function resetCategory(catId){
  cleanupVoice();
  STATE[catId] = defaultCatState();
  saveState();
  render();
}

function resetAllCategories(){
  cleanupVoice();
  CATS.forEach(c=>{ STATE[c.id] = defaultCatState(); });
  saveState();
  render();
}

/* =========================================================
   RENDERING
   ========================================================= */
let activeCat = "fib";

function buildTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  CATS.forEach(c=>{
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (c.id===activeCat ? " active":"");
    btn.innerHTML = `<span class="ic">${c.icon}</span><span>${c.label}</span><span class="count">${c.data.length}</span>`;
    btn.onclick = ()=>{ activeCat = c.id; render(); };
    nav.appendChild(btn);
  });
}

function norm(s){ return (s||"").trim().toLowerCase().replace(/\s+/g," "); }

function render(){
  buildTabs();
  const cat = CATS.find(c=>c.id===activeCat);
  document.getElementById("catTitle").textContent = cat.title;
  document.getElementById("catSub").textContent = cat.sub;

  const st = STATE[cat.id];
  const list = document.getElementById("qList");
  const toolbarRow = document.getElementById("toolbarRow");
  const modeRow = document.getElementById("modeToggleRow");

  const voiceCapable = VOICE_CAPABLE.includes(cat.id);
  const mode = modeByCategory[cat.id] || "list";

  /* mode toggle row (Fill Blanks / One Word / True-False only) */
  modeRow.innerHTML = "";
  if(voiceCapable){
    renderModeToggle(cat, modeRow, mode);
  }

  if(voiceCapable && mode === "voice"){
    toolbarRow.style.display = "none";
    list.innerHTML = "";
    startVoiceRound(cat, st, list);
    updateProgress(cat, st);
    document.getElementById("resetBtn").onclick = ()=>resetCategory(cat.id);
    return;
  }

  cleanupVoice();
  toolbarRow.style.display = "flex";
  list.innerHTML = "";

  if(cat.type==="fib") renderFIB(cat, st, list);
  else if(cat.type==="mcq") renderMCQ(cat, st, list);
  else if(cat.type==="oneword") renderOneWord(cat, st, list);
  else if(cat.type==="defs") renderDefs(cat, st, list);
  else if(cat.type==="short") renderShort(cat, st, list);
  else if(cat.type==="tf") renderTF(cat, st, list);
  else if(cat.type==="dist") renderDist(cat, st, list);
  else if(cat.type==="label") renderLabel(cat, st, list);
  else if(cat.type==="reasoning") renderReasoning(cat, st, list);

  updateProgress(cat, st);

  document.getElementById("resetBtn").onclick = ()=>resetCategory(cat.id);
  const checkBtn = document.getElementById("checkBtn");
  const selfCheckTypes = ["defs","short","dist","reasoning"];
  checkBtn.style.display = selfCheckTypes.includes(cat.type) ? "none" : "inline-block";
  checkBtn.onclick = ()=>{ st.checked = true; saveState(); render(); scrollToTop(); };
}

function renderModeToggle(cat, container, mode){
  container.innerHTML = `
    <div class="mode-toggle">
      <button type="button" class="mode-btn ${mode==="list"?"active":""}" data-mode="list">📋 List View</button>
      <button type="button" class="mode-btn ${mode==="voice"?"active":""}" data-mode="voice">🎙️ Voice Round</button>
    </div>`;
  container.querySelectorAll(".mode-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const m = btn.dataset.mode;
      if((modeByCategory[cat.id]||"list") === m) return;
      cleanupVoice();
      modeByCategory[cat.id] = m;
      render();
    });
  });
}

function scrollToTop(){
  const el = document.getElementById("main");
  if(el && typeof el.scrollIntoView === "function"){
    el.scrollIntoView({behavior:"smooth", block:"start"});
  }
}

function updateProgress(cat, st){
  const pill = document.getElementById("catProgress");
  if(cat.type==="defs" || cat.type==="short" || cat.type==="dist" || cat.type==="reasoning"){
    const total = cat.data.length;
    const known = Object.values(st.answers).filter(v=>v && v.mark==="got").length;
    pill.textContent = `${known}/${total} mastered`;
    return;
  }
  const total = cat.type==="label" ? cat.data.reduce((n,d)=>n+d.points.length,0) : cat.data.length;
  if(!st.checked){
    let answered=0;
    if(cat.type==="label"){
      cat.data.forEach(d=>d.points.forEach(p=>{ if(st.answers[d.key+"-"+p.n]) answered++; }));
    } else {
      answered = Object.keys(st.answers).filter(k=>norm(st.answers[k])!=="").length;
    }
    pill.textContent = `${answered}/${total} answered`;
  } else {
    let score=0;
    if(cat.type==="fib"){
      cat.data.forEach((q,i)=>{ if(q.a.some(acc=>norm(acc)===norm(st.answers[i]))) score++; });
    } else if(cat.type==="mcq"){
      cat.data.forEach((q,i)=>{ if(st.answers[i]===q.c) score++; });
    } else if(cat.type==="oneword"){
      cat.data.forEach((q,i)=>{ if(q.a.some(acc=>norm(acc)===norm(st.answers[i]))) score++; });
    } else if(cat.type==="tf"){
      cat.data.forEach((q,i)=>{ if(st.answers[i]===q.a) score++; });
    } else if(cat.type==="label"){
      cat.data.forEach(d=>d.points.forEach(p=>{ if(st.answers[d.key+"-"+p.n]===p.correct) score++; }));
    }
    pill.textContent = `Score: ${score}/${total}`;
  }
}

function renderFIB(cat, st, list){
  cat.data.forEach((q,i)=>{
    const card = document.createElement("div"); card.className="qcard";
    const parts = q.t.split("___");
    card.innerHTML = `
      <div class="qtext"><span class="qnum">${i+1}</span>${parts[0]}<span class="blank-txt">_____</span>${parts[1]||""}</div>
      <input type="text" placeholder="Type the missing word(s)" data-i="${i}" value="${st.answers[i]||""}">
      <div class="feedback" data-fb="${i}"></div>
    `;
    list.appendChild(card);
  });
  wireTextInputs(list, cat, st, (i,val)=>{
    const q = cat.data[i];
    return q.a.some(acc=>norm(acc)===norm(val));
  }, (i)=>`Correct answer: <b>${cat.data[i].a[0]}</b>`);
}

function wireTextInputs(list, cat, st, isCorrectFn, correctLabelFn){
  list.querySelectorAll("input[type=text]").forEach(inp=>{
    inp.addEventListener("input", ()=>{

      st.answers[i] = inp.value;
      saveState();
    });

/* =========================================================
   VOICE ROUND
   A hands-free, single-question-at-a-time flow for Fill in
   the Blanks, One Word, and True/False. Exactly one "stage"
   element is ever in the DOM — every transition replaces the
   whole stage container's contents rather than appending to it.
   ========================================================= */

function speakableText(raw){
  // Turn any run of 3+ underscores (blank of any length) into a spoken cue.
  return String(raw||"").replace(/_{3,}/g, " blank ").replace(/\s+/g," ").trim();
}

function speechMatches(transcript, acceptedList){
  const t = norm(transcript);
  if(!t) return false;
  return (acceptedList||[]).some(acc=>{
    const a = norm(acc);
    if(!a) return false;
    return t===a || t.includes(a) || a.includes(t);
  });
}

function speechToBool(transcript){
  const t = norm(transcript);
  if(!t) return null;
  const falseWords = ["false","incorrect","wrong","not true","no"];
  const trueWords = ["true","correct","right","yes"];
  if(falseWords.some(w=>t.includes(w))) return false;
  if(trueWords.some(w=>t.includes(w))) return true;
  return null;
}

/* speak() reads text aloud and fires `onNearEnd` either at the start of the
   last word (when the browser's TTS reports word boundaries) or, failing
   that, when speech actually finishes — so listening starts with no
   perceptible gap, and never while the question is still being read. */
function speak(text, onNearEnd, onDone){
  if(!window.speechSynthesis || !window.SpeechSynthesisUtterance){
    if(onNearEnd) onNearEnd();
    if(onDone) onDone();
    return;
  }
  try{ window.speechSynthesis.cancel(); }catch(e){}
  const cleanText = String(text||"").trim();
  if(!cleanText){
    if(onNearEnd) onNearEnd();
    if(onDone) onDone();
    return;
  }
  const utter = new SpeechSynthesisUtterance(cleanText);
  utter.rate = 0.95;
  const words = cleanText.split(/\s+/);
  const lastWord = words[words.length-1] || "";
  const lastWordStart = lastWord ? cleanText.lastIndexOf(lastWord) : -1;
  let fired = false;
  const fireNearEnd = ()=>{ if(!fired){ fired = true; if(onNearEnd) onNearEnd(); } };
  utter.onboundary = (e)=>{
    if(fired) return;
    if(typeof e.charIndex === "number" && lastWordStart >= 0 && e.charIndex >= lastWordStart){
      fireNearEnd();
    }
  };
  utter.onend = ()=>{ fireNearEnd(); if(onDone) onDone(); };
  utter.onerror = ()=>{ fireNearEnd(); if(onDone) onDone(); };
  try{ window.speechSynthesis.speak(utter); }
  catch(e){ fireNearEnd(); if(onDone) onDone(); }
}

const VR = {
  active:false,
  catId:null,
  st:null,
  stageEl:null,
  idx:0,
  score:0,
  answeredCount:0,
  recognition:null,
  listenTimer:null,
  phase:"idle" // idle | miccheck | micerror | asking | listening | result | summary
};
window.VR = VR; // exposed for diagnostics/testing; not otherwise referenced externally

function cleanupVoice(){
  if(VR.listenTimer){ clearTimeout(VR.listenTimer); VR.listenTimer = null; }
  if(VR.recognition){
    try{ VR.recognition.onresult = null; VR.recognition.onend = null; VR.recognition.onerror = null; VR.recognition.abort(); }catch(e){}
    VR.recognition = null;
  }
  if(window.speechSynthesis){
    try{ window.speechSynthesis.cancel(); }catch(e){}
  }
  VR.active = false;
  VR.phase = "idle";
}

function getSpeechRecognitionCtor(){
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

function startVoiceRound(cat, st, stageEl){
  // Re-entering the same active round shouldn't restart it from scratch.
  if(VR.active && VR.catId === cat.id && VR.stageEl === stageEl){
    renderVoiceStage();
    return;
  }
  cleanupVoice();
  VR.active = true;
  VR.catId = cat.id;
  VR.st = st;
  VR.stageEl = stageEl;
  VR.idx = 0;
  VR.score = 0;
  VR.answeredCount = 0;
  VR.phase = "miccheck";
  renderVoiceStage();

  const SpeechRec = getSpeechRecognitionCtor();
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !SpeechRec){
    VR.active = false; // no genuine round has started; let a future retry begin cleanly
    VR.phase = "micerror";
    renderVoiceStage();
    return;
  }

  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    try{ stream.getTracks().forEach(tr=>tr.stop()); }catch(e){}
    if(!VR.active || VR.catId !== cat.id) return; // user navigated away meanwhile
    VR.phase = "asking";
    renderVoiceStage();
    askCurrentQuestion();
  }).catch(()=>{
    VR.active = false; // no genuine round has started; let a future retry begin cleanly
    VR.phase = "micerror";
    renderVoiceStage();
  });
}

function currentVoiceQuestion(){
  const cat = CATS.find(c=>c.id===VR.catId);
  return cat.data[VR.idx];
}

function askCurrentQuestion(){
  const cat = CATS.find(c=>c.id===VR.catId);
  if(!cat || VR.idx >= cat.data.length){
    finishVoiceRound();
    return;
  }
  VR.phase = "asking";
  VR.lastResult = null;
  renderVoiceStage();

  const q = cat.data[VR.idx];
  const spokenText = speakableText(q.t);

  speak(spokenText, ()=>{
    if(!VR.active) return;
    beginListening();
  });
}

function beginListening(){
  const cat = CATS.find(c=>c.id===VR.catId);
  const SpeechRec = getSpeechRecognitionCtor();
  if(!SpeechRec){
    handleVoiceAnswer("");
    return;
  }
  VR.phase = "listening";
  renderVoiceStage();

  let settled = false;
  const rec = new SpeechRec();
  VR.recognition = rec;
  try{ rec.lang = "en-US"; }catch(e){}
  rec.continuous = false;
  rec.interimResults = false;
  rec.maxAlternatives = 1;

  const finish = (transcript)=>{
    if(settled) return;
    settled = true;
    if(VR.listenTimer){ clearTimeout(VR.listenTimer); VR.listenTimer = null; }
    VR.recognition = null;
    if(!VR.active) return;
    handleVoiceAnswer(transcript);
  };

  rec.onresult = (e)=>{
    let transcript = "";
    try{ transcript = e.results[0][0].transcript; }catch(err){ transcript = ""; }
    finish(transcript);
  };
  rec.onerror = ()=>{ finish(""); };
  rec.onend = ()=>{ finish(""); };

  VR.listenTimer = setTimeout(()=>{
    if(settled) return;
    try{ rec.stop(); }catch(e){}
    finish("");
  }, 5000);

  try{ rec.start(); }
  catch(e){ finish(""); }
}

function handleVoiceAnswer(transcript){
  const cat = CATS.find(c=>c.id===VR.catId);
  const q = cat.data[VR.idx];
  let correct = false;
  let correctLabel = "";
  let noAnswer = norm(transcript) === "";

  if(cat.type === "fib" || cat.type === "oneword"){
    correct = !noAnswer && speechMatches(transcript, q.a);
    correctLabel = q.a[0];
    VR.st.answers[VR.idx] = noAnswer ? (VR.st.answers[VR.idx]||"") : transcript;
  } else if(cat.type === "tf"){
    const spoken = noAnswer ? null : speechToBool(transcript);
    correct = spoken !== null && spoken === q.a;
    correctLabel = q.a ? "True" : "False";
    if(spoken !== null) VR.st.answers[VR.idx] = spoken;
  }

  VR.answeredCount++;
  if(correct) VR.score++;
  VR.st.checked = true;
  saveState();

  VR.lastResult = {correct, noAnswer, transcript, correctLabel};
  VR.phase = "result";
  renderVoiceStage();

  const feedbackText = correct ? "Correct!" : (noAnswer ? `No answer heard. The correct answer is ${correctLabel}.` : `Not quite. The correct answer is ${correctLabel}.`);
  speak(feedbackText, ()=>{}, ()=>{
    if(!VR.active) return;
    VR.listenTimer = setTimeout(()=>{
      if(!VR.active) return;
      VR.idx++;
      askCurrentQuestion();
    }, 900);
  });
}

function skipVoiceQuestion(){
  if(!VR.active) return;
  if(VR.listenTimer){ clearTimeout(VR.listenTimer); VR.listenTimer = null; }
  if(VR.recognition){ try{ VR.recognition.abort(); }catch(e){} VR.recognition = null; }
  if(window.speechSynthesis){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  VR.idx++;
  askCurrentQuestion();
}

function endVoiceRoundNow(){
  if(!VR.active) return;
  if(VR.listenTimer){ clearTimeout(VR.listenTimer); VR.listenTimer = null; }
  if(VR.recognition){ try{ VR.recognition.abort(); }catch(e){} VR.recognition = null; }
  if(window.speechSynthesis){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  finishVoiceRound();
}

function finishVoiceRound(){
  if(!VR.active) return;
  VR.st.checked = true;
  saveState();
  VR.phase = "summary";
  renderVoiceStage();
}

function redoVoiceRound(){
  const cat = CATS.find(c=>c.id===VR.catId);
  const st = VR.st;
  const stageEl = VR.stageEl;
  cleanupVoice();
  startVoiceRound(cat, st, stageEl);
}

function exitVoiceToList(){
  const catId = VR.catId;
  cleanupVoice();
  modeByCategory[catId] = "list";
  render();
}

/* Renders the current VR.phase into VR.stageEl, always replacing the
   entire contents so only one question-stage element exists at a time. */
function renderVoiceStage(){
  const stage = VR.stageEl;
  if(!stage) return;
  const cat = CATS.find(c=>c.id===VR.catId);
  const total = cat ? cat.data.length : 0;

  stage.innerHTML = "";
  const card = document.createElement("div");
  card.className = "qcard voice-card";

  if(VR.phase === "miccheck"){
    card.innerHTML = `
      <div class="voice-orb">🎙️</div>
      <div class="voice-phase-label">Requesting microphone…</div>
      <div class="voice-qtext">Please allow microphone access to start the Voice Round.</div>
    `;
  } else if(VR.phase === "micerror"){
    card.innerHTML = `
      <div class="voice-orb">🚫</div>
      <div class="voice-phase-label">Microphone unavailable</div>
      <div class="voice-qtext">Voice Round couldn't access your microphone.</div>
      <ul class="mic-explain-list">
        <li>This browser app may not have microphone permission at the device/OS level — check your phone or computer's system settings.</li>
        <li>Or this page may have already been blocked from using the microphone in the browser's own site settings — check the site permissions (often a lock or ⓘ icon in the address bar).</li>
      </ul>
      <div class="voice-controls">
        <button class="action btn-primary" data-act="retry">Try again</button>
        <button class="action btn-ghost" data-act="back">Back to List View</button>
      </div>
    `;
    card.querySelector('[data-act="retry"]').addEventListener("click", ()=> startVoiceRound(cat, VR.st, stage));
    card.querySelector('[data-act="back"]').addEventListener("click", exitVoiceToList);
  } else if(VR.phase === "asking"){
    const q = cat.data[VR.idx];
    const displayText = cat.type === "fib" ? q.t.replace(/_{3,}/g, "▁▁▁▁") : q.t;
    card.innerHTML = `
      <div class="voice-progress">Question ${VR.idx+1} of ${total}</div>
      <div class="voice-orb">🔊</div>
      <div class="voice-phase-label">Reading question…</div>
      <div class="voice-qtext">${displayText}</div>
      <div class="voice-controls">
        <button class="action btn-mini" data-act="skip">Skip</button>
        <button class="action btn-ghost" data-act="end">End round</button>
      </div>
    `;
    card.querySelector('[data-act="skip"]').addEventListener("click", skipVoiceQuestion);
    card.querySelector('[data-act="end"]').addEventListener("click", endVoiceRoundNow);
  } else if(VR.phase === "listening"){
    const q = cat.data[VR.idx];
    const displayText = cat.type === "fib" ? q.t.replace(/_{3,}/g, "▁▁▁▁") : q.t;
    card.innerHTML = `
      <div class="voice-progress">Question ${VR.idx+1} of ${total}</div>
      <div class="voice-orb listening">🎤</div>
      <div class="voice-phase-label">Listening… (5 seconds)</div>
      <div class="voice-qtext">${displayText}</div>
      <div class="voice-transcript">Speak your answer now</div>
      <div class="voice-controls">
        <button class="action btn-mini" data-act="skip">Skip</button>
        <button class="action btn-ghost" data-act="end">End round</button>
      </div>
    `;
    card.querySelector('[data-act="skip"]').addEventListener("click", skipVoiceQuestion);
    card.querySelector('[data-act="end"]').addEventListener("click", endVoiceRoundNow);
  } else if(VR.phase === "result"){
    const r = VR.lastResult || {};
    const q = cat.data[VR.idx];
    const displayText = cat.type === "fib" ? q.t.replace(/_{3,}/g, "▁▁▁▁") : q.t;
    card.innerHTML = `
      <div class="voice-progress">Question ${VR.idx+1} of ${total}</div>
      <div class="voice-orb">${r.correct ? "✅" : "❌"}</div>
      <div class="voice-qtext">${displayText}</div>
      <div class="voice-transcript">${r.noAnswer ? "No answer heard" : `You said: "${r.transcript}"`}</div>
      <div class="voice-result ${r.correct ? "good" : "bad"}">${r.correct ? "Correct!" : `Correct answer: ${r.correctLabel}`}</div>
      <div class="voice-controls">
        <button class="action btn-ghost" data-act="end">End round</button>
      </div>
    `;
    card.querySelector('[data-act="end"]').addEventListener("click", endVoiceRoundNow);
  } else if(VR.phase === "summary"){
    card.innerHTML = `
      <div class="voice-phase-label">Voice Round complete</div>
      <div class="voice-summary-score">${VR.score} / ${VR.answeredCount || 0}</div>
      <div class="voice-qtext" style="font-size:.85rem; color:var(--muted); font-weight:600;">questions answered correctly out of ${VR.answeredCount || 0} attempted (${total} total in this section)</div>
      <div class="voice-controls">
        <button class="action btn-primary" data-act="redo">Redo round</button>
        <button class="action btn-ghost" data-act="list">Return to List View</button>
      </div>
    `;
    card.querySelector('[data-act="redo"]').addEventListener("click", redoVoiceRound);
    card.querySelector('[data-act="list"]').addEventListener("click", exitVoiceToList);
  }

  stage.appendChild(card);
}

/* =========================================================
   INIT
   ========================================================= */
(function init(){
  loadState();
  render();
  if(!storageAvailable){
    const note = document.querySelector(".footer-note");
    if(note) note.innerHTML = "⚠️ This browser is blocking local storage, so progress will only be kept for this session and won't survive closing the app.";
  }
  const resetAllBtn = document.getElementById("resetAllBtn");
  if(resetAllBtn){
    resetAllBtn.addEventListener("click", ()=>{
      const ok = window.confirm("Reset ALL answers in every section? This can't be undone.");
      if(ok) resetAllCategories();
    });
  }
})();
</script>
</body>
</html>
